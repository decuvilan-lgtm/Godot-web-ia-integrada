name: Remote Godot task
run-name: Godot task ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      task_profile:
        description: Fixed Godot or browser task profile
        required: true
        type: choice
        options:
          - engine_smoke
          - scene_audit_3d
          - web_browser_audit
      request_id:
        description: Correlation ID generated by the Relay
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: remote-godot-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  godot-task:
    if: inputs.task_profile != 'web_browser_audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl unzip
      - name: Execute isolated Godot task
        env:
          GODOT_TASK_PROFILE: ${{ inputs.task_profile }}
          GODOT_TASK_REQUEST_ID: ${{ inputs.request_id }}
        run: bash scripts/ci/run-godot-task.sh
      - name: Upload Godot task evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-task-${{ inputs.request_id }}
          path: /tmp/godot-task-results/
          if-no-files-found: warn
          retention-days: 7

  web-browser-audit:
    if: inputs.task_profile == 'web_browser_audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Open the published editor in real Chromium
        env:
          GODOT_TASK_REQUEST_ID: ${{ inputs.request_id }}
        run: python scripts/ci/run-web-browser-audit.py
      - name: Upload browser screenshots and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-audit-${{ inputs.request_id }}
          path: /tmp/godot-task-results/
          if-no-files-found: warn
          retention-days: 7
