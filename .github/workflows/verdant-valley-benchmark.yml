name: Verdant Valley — Full Development Benchmark

on:
  push:
    branches:
      - test/verdant-valley-development-benchmark
    paths:
      - "examples/verdant-valley/**"
      - "headless/native-editor/addons/headless_session_bridge/**"
      - ".github/workflows/verdant-valley-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-runtime-and-editor-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated benchmark project and original artwork
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil xvfb ffmpeg xdotool mesa-vulkan-drivers libvulkan1
          PROJECT="$GITHUB_WORKSPACE/examples/verdant-valley"
          python3 "$PROJECT/tools/generate_assets.py"
          mkdir -p "$PROJECT/addons"
          cp -R "$GITHUB_WORKSPACE/headless/native-editor/addons/headless_session_bridge" "$PROJECT/addons/headless_session_bridge"
          cat >> "$PROJECT/project.godot" <<'PROJECT_SETTINGS'

          [editor_plugins]
          enabled=PackedStringArray("res://addons/headless_session_bridge/plugin.cfg")
          PROJECT_SETTINGS
          mkdir -p artifacts

      - name: Download and verify the custom Godot 4.7.2 Linux runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot-runtime
          URL="https://github.com/decuvilan-lgtm/Godot-engine4-v4.7.2-stable-difusion-modificado/releases/download/godot-linux-headless-agent-v0.1.0"
          curl --fail --location --retry 3 "$URL/godot-linux-headless-agent.tar.gz" -o /tmp/godot-runtime/runtime.tar.gz
          printf '%s  %s\n' "87243b7b1d1384900907a2ee52811f2dab414fe485e1ee911ee527e693a0a9f4" "/tmp/godot-runtime/runtime.tar.gz" | sha256sum --check
          tar -xzf /tmp/godot-runtime/runtime.tar.gz -C /tmp/godot-runtime
          GODOT="/tmp/godot-runtime/godot-linux-headless-agent/godot"
          chmod +x "$GODOT"
          "$GODOT" --headless --version | tee artifacts/godot-version.txt

      - name: Diagnose project in a real Headless Editor session
        shell: bash
        run: |
          set -uo pipefail
          GODOT="/tmp/godot-runtime/godot-linux-headless-agent/godot"
          PROJECT="$GITHUB_WORKSPACE/examples/verdant-valley"
          export GODOT_SILENCE_ROOT_WARNING=1
          "$GODOT" --headless --editor --path "$PROJECT" --quit > artifacts/editor-headless.log 2>&1
          status=$?
          echo "$status" > artifacts/editor-headless-exit-code.txt
          cat artifacts/editor-headless.log
          exit 0

      - name: Import and run full gameplay suite in Actions Headless
        shell: bash
        run: |
          set -uo pipefail
          GODOT="/tmp/godot-runtime/godot-linux-headless-agent/godot"
          PROJECT="$GITHUB_WORKSPACE/examples/verdant-valley"
          export GODOT_SILENCE_ROOT_WARNING=1
          "$GODOT" --headless --path "$PROJECT" --editor --import --quit > artifacts/import.log 2>&1
          echo "$?" > artifacts/import-exit-code.txt
          "$GODOT" --headless --path "$PROJECT" --script res://tests/test_suite.gd > artifacts/functional-tests.log 2>&1
          echo "$?" > artifacts/functional-tests-exit-code.txt
          cat artifacts/import.log
          cat artifacts/functional-tests.log
          exit 0

      - name: Start real editor, connect through bridge and capture editor plus game video
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot-runtime/godot-linux-headless-agent/godot"
          PROJECT="$GITHUB_WORKSPACE/examples/verdant-valley"
          export GODOT_SILENCE_ROOT_WARNING=1 GODOT PROJECT VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          mkdir -p artifacts
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -euo pipefail <<'SCRIPT'
          "$GODOT" --editor --path "$PROJECT" --scene res://scenes/main.tscn --resolution 1500x900 --position 20,20 --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy > artifacts/editor.log 2>&1 < /dev/null &
          editor_pid=$!
          trap 'kill -TERM "$editor_pid" 2>/dev/null || true; wait "$editor_pid" 2>/dev/null || true' EXIT
          BRIDGE_EVIDENCE_DIR="$GITHUB_WORKSPACE/artifacts" python3 "$PROJECT/tools/bridge_probe.py" | tee artifacts/bridge-probe.log
          # Zoom out the 2D viewport so the full 3,900 px level is framed.
          /usr/bin/xdotool mousemove --sync 800 380
          /usr/bin/xdotool click --repeat 20 --delay 80 5
          sleep 1
          ffmpeg -nostdin -y -loglevel error -f x11grab -video_size 1600x1000 -i "$DISPLAY" -frames:v 1 artifacts/editor-desktop.png
          kill -TERM "$editor_pid" 2>/dev/null || true
          for _ in 1 2 3 4 5; do
            kill -0 "$editor_pid" 2>/dev/null || break
            sleep 1
          done
          kill -KILL "$editor_pid" 2>/dev/null || true
          wait "$editor_pid" 2>/dev/null || true
          trap - EXIT
          "$GODOT" --path "$PROJECT" --resolution 1280x720 --position 0,0 --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy -- --playtest > artifacts/game.log 2>&1 < /dev/null &
          game_pid=$!
          trap 'kill -TERM "$game_pid" 2>/dev/null || true; sleep 2; kill -KILL "$game_pid" 2>/dev/null || true; wait "$game_pid" 2>/dev/null || true' EXIT
          ffmpeg -nostdin -y -loglevel error -f x11grab -video_size 1280x720 -framerate 30 -i "$DISPLAY" -t 17 -c:v libx264 -pix_fmt yuv420p -preset veryfast artifacts/gameplay.mp4 > artifacts/ffmpeg-capture.log 2>&1 < /dev/null &
          capture_pid=$!
          sleep 1.2
          ffmpeg -nostdin -y -loglevel error -f x11grab -video_size 1280x720 -i "$DISPLAY" -frames:v 1 artifacts/gameplay-start.png
          wait "$capture_pid"
          ffmpeg -nostdin -y -loglevel error -f x11grab -video_size 1280x720 -i "$DISPLAY" -frames:v 1 artifacts/gameplay.png
          kill -TERM "$game_pid" 2>/dev/null || true
          for _ in 1 2 3 4 5; do
            kill -0 "$game_pid" 2>/dev/null || break
            sleep 1
          done
          kill -KILL "$game_pid" 2>/dev/null || true
          wait "$game_pid" 2>/dev/null || true
          trap - EXIT
          grep -E 'SCRIPT ERROR|ERROR:' artifacts/editor-headless.log artifacts/import.log artifacts/functional-tests.log artifacts/editor.log artifacts/game.log > artifacts/error-summary.log || true
          cat artifacts/error-summary.log
          if [ "$(cat artifacts/functional-tests-exit-code.txt)" != "0" ]; then echo "Functional suite failed"; exit 1; fi
          if grep -Eq 'SCRIPT ERROR|ERROR:' artifacts/editor-headless.log artifacts/import.log artifacts/game.log; then echo "Godot emitted project/runtime errors"; exit 1; fi
          editor_unexpected_errors=$(grep -E 'SCRIPT ERROR|ERROR:' artifacts/editor.log | grep -v -E 'Required Vulkan instance extension VK_KHR_surface not found|Condition "err != OK" is true' || true)
          if [ -n "$editor_unexpected_errors" ]; then echo "$editor_unexpected_errors"; exit 1; fi
          grep -q 'PLAYTEST EVENT: pickup collected' artifacts/game.log
          grep -q 'PLAYTEST EVENT: healing crystal used' artifacts/game.log
          grep -q 'PLAYTEST EVENT: checkpoint reached' artifacts/game.log
          grep -q 'PLAYTEST EVENT: critter stomped' artifacts/functional-tests.log
          grep -q 'PLAYTEST EVENT: crystal activated' artifacts/game.log
          grep -q 'PLAYTEST EVENT: portal body_entered body=Player' artifacts/game.log
          grep -q 'PLAYTEST RESULT:.*finished=true' artifacts/game.log
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name, expected in [("editor-desktop.png", (1600, 1000)), ("gameplay.png", (1280, 720)), ("editor-bridge.png", None)]:
              path = Path("artifacts") / name
              if not path.is_file():
                  raise SystemExit(f"Missing screenshot: {name}")
              with Image.open(path) as image:
                  if expected and image.size != expected:
                      raise SystemExit(f"{name}: expected {expected}, got {image.size}")
                  print(f"FRAME {name}: {image.size[0]}x{image.size[1]}")
          PY
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -show_entries format=duration -of default=noprint_wrappers=1 artifacts/gameplay.mp4 | tee artifacts/video-metadata.txt
          grep -q 'width=1280' artifacts/video-metadata.txt
          grep -q 'height=720' artifacts/video-metadata.txt
          SCRIPT

      - name: Upload full development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdant-valley-full-development-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
