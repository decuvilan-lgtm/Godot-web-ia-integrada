          }
          Path('artifacts/render-session-video.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          if not videos or any(p.stat().st_size <= 1024 for p in videos):
              raise SystemExit('No se generó una grabación WebM válida de la sesión Render.')
          PY

      - name: Comparar capturas antes y después de cada acción
        if: always() && steps.browser.outcome != 'skipped'
        run: |
          set -euo pipefail
          if [ -d artifacts ]; then
            . .venv/bin/activate
            python scripts/analyze_gameplay_captures.py artifacts
          fi

      - name: Crear hojas de contacto de las secuencias
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          editor_frames=(artifacts/editor-sequence-*.png)
          game_frames=(artifacts/game-preview-sequence-*.png)
          if [ "${#editor_frames[@]}" -gt 0 ]; then
            montage "${editor_frames[@]}" -tile 5x -geometry 480x300+8+8 artifacts/editor-sequence-contact-sheet.png
          fi
          if [ "${#game_frames[@]}" -gt 0 ]; then
            montage "${game_frames[@]}" -tile 4x -geometry 480x300+8+8 artifacts/game-preview-sequence-contact-sheet.png
          fi

      - name: Publicar enlace de apertura y resultado
        if: always()
        env:
          OWNER: ${{ steps.repo.outputs.owner }}
          REPO: ${{ steps.repo.outputs.repo }}
          PROJECT_NAME: ${{ steps.repo.outputs.project_name }}
          BRANCH: ${{ steps.repo.outputs.branch }}
          BRANCH_IS_DEFAULT: ${{ steps.repo.outputs.branch_is_default }}
          PROJECT_PATH: ${{ steps.repo.outputs.project_path }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Importación Godot Web"
            echo
            if [ -n "${OWNER:-}" ] && [ -n "${REPO:-}" ]; then
              echo "- Repositorio: https://github.com/${OWNER}/${REPO}"
              echo "- Rama: ${BRANCH:-predeterminada}"
              echo "- Carpeta del proyecto: ${PROJECT_PATH:-raíz}"
              echo "- Nombre del proyecto Godot: ${PROJECT_NAME:-${REPO}}"
              echo "- Abrir en Godot Web: https://godot-web-ia-integrada-rt2l.onrender.com/?repo=${OWNER}%2F${REPO}"
            fi
            echo "- Resultado del workflow: **${JOB_STATUS}**"
            echo
            if [ "$JOB_STATUS" = "success" ]; then
              echo "La prueba confirmó la precarga del ZIP, la apertura de ${OWNER}/${REPO} y una captura OCR verificable del editor."
            else
              echo "La prueba no consiguió una captura verificable del repositorio seleccionado con el proyecto abierto. Revisa el diagnóstico adjunto."
            fi
            if [ -f artifacts/result.json ]; then
              python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/result.json").read_text())
          print()
          print("### Verificación del Relay en producción")
          live_status = data.get("liveRelayCheck", "not-run")
          print(f"- Rama/subcarpeta: **{live_status}**")
          if live_status != "success":
              print("- Revisa `live-relay-check.json` en el artefacto; la importación raíz no sustituye esta comprobación.")
          print()
          print("### Secuencias visuales")
          for key, label in (("editorSequence", "Editor"), ("gamePreviewSequence", "Juego")):
              sequence = data.get(key)
              if sequence:
                  print(f"- {label}: {sequence.get('capturedFrames', 0)}/{sequence.get('requestedFrames', 0)} imágenes; intervalo {sequence.get('intervalMs')} ms; completa: {sequence.get('complete', False)}")
              else:
                  print(f"- {label}: sin secuencia confirmada")
          timeline_path = Path("artifacts/gameplay-timeline.json")
          if timeline_path.exists():
              timeline = json.loads(timeline_path.read_text())
              print()
              print("### Controles de gameplay")
              print(f"- Acciones enviadas: {timeline.get('actions_sent', 0)}/{timeline.get('actions_requested', 0)}")
          feedback = data.get("gameplayFeedback") or {}
          if feedback:
              print(f"- Ataque: {'daño visible detectado' if feedback.get('attackDamageDetected') else 'sin confirmación OCR'}")
          touch = data.get("touchMovement") or {}
          if touch:
              print(f"- Joystick táctil: X {touch.get('xBefore', '?')} → {touch.get('xAfter', '?')}; movimiento confirmado: {touch.get('playerPositionChanged', False)}")
          video_path = Path("artifacts/render-session-video.json")
          if video_path.exists():
              video = json.loads(video_path.read_text())
              print(f"- Grabación: {video.get('videoCount', 0)} WebM; estado: {video.get('status', 'unknown')}")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar capturas y diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-import-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14