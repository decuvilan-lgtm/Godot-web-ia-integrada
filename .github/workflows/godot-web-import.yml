name: Importar repositorio en Godot Web

on:
  push:
    paths:
      - ".github/workflows/godot-web-import.yml"
      - "scripts/gameplay-test-controller.cjs"
      - "scripts/test-gameplay-test-controller.cjs"
      - "scripts/godot-input-map.cjs"
      - "scripts/test-godot-input-map.cjs"
      - "scripts/analyze_gameplay_captures.py"
      - "scripts/patch-web-shell.py"
      - "scripts/test_patch_web_shell.py"
      - "scripts/test_analyze_gameplay_captures.py"
      - "tests/control-profiles/escondite-smoke.json"
  workflow_dispatch:
    inputs:
      repository_url:
        description: "URL de un repositorio público de GitHub con un proyecto Godot"
        required: true
        default: "https://github.com/gavilandavid89-pixel/Escondite"
        type: string
      branch:
        description: "Rama de GitHub (vacío = rama predeterminada)"
        required: false
        default: ""
        type: string
      project_path:
        description: "Subcarpeta que contiene project.godot (vacío = raíz)"
        required: false
        default: ""
        type: string
      startup_timeout:
        description: "Tiempo máximo de espera del arranque de Godot (segundos)"
        required: false
        default: "180"
        type: string
      editor_frames:
        description: "Cantidad de capturas consecutivas del editor (1-12)"
        required: false
        default: "5"
        type: string
      editor_interval_ms:
        description: "Intervalo entre capturas del editor en milisegundos"
        required: false
        default: "900"
        type: string
      game_frames:
        description: "Cantidad de capturas consecutivas del juego (1-24)"
        required: false
        default: "8"
        type: string
      game_interval_ms:
        description: "Intervalo entre capturas del juego en milisegundos"
        required: false
        default: "500"
        type: string
      gameplay_duration_ms:
        description: "Duración de observación interactiva (100-60000 ms)"
        required: false
        default: "10000"
        type: string
      gameplay_actions_json:
        description: "Acciones opcionales JSON; controles explícitos del proyecto"
        required: false
        default: '[]'
        type: string

permissions:
  contents: read

concurrency:
  group: godot-web-import-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  import-and-check:
    name: Abrir Godot Web e importar ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obtener helper de inspección
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/godot_web_ocr.py
            scripts/gameplay-test-controller.cjs
            scripts/test-gameplay-test-controller.cjs
            scripts/godot-input-map.cjs
            scripts/test-godot-input-map.cjs
            scripts/analyze_gameplay_captures.py
            scripts/patch-web-shell.py
            scripts/test_patch_web_shell.py
            tests/control-profiles/escondite-smoke.json
          sparse-checkout-cone-mode: false

      - name: Probar controlador de gameplay
        run: |
          node scripts/test-gameplay-test-controller.cjs
          node scripts/test-godot-input-map.cjs
          python scripts/test_patch_web_shell.py

      - name: Validar repositorio, rama y ubicación del proyecto
        id: repo
        env:
          REPOSITORY_URL: ${{ inputs.repository_url || (github.event_name == 'push' && 'https://github.com/gavilandavid89-pixel/Ajedrez-2c2') || 'https://github.com/gavilandavid89-pixel/Escondite' }}
          REQUESTED_BRANCH: ${{ inputs.branch || (github.event_name == 'push' && 'main') || '' }}
          PROJECT_PATH: ${{ inputs.project_path || (github.event_name == 'push' && 'ajedrez_2c2_v161') || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, re, urllib.parse, urllib.request, urllib.error
          raw = os.environ["REPOSITORY_URL"].strip()
          match = re.fullmatch(r"https://github\.com/([A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?)/([A-Za-z0-9](?:[A-Za-z0-9._-]{0,98}[A-Za-z0-9])?)/?", raw)
          if not match:
              raise SystemExit("Usa una URL https://github.com/owner/repository (sin rutas adicionales).")
          owner, repo = match.groups()

          def get_json(url):
              headers = {"Accept": "application/vnd.github+json", "User-Agent": "Godot-Web-Import-Action"}
              token = os.environ.get("GITHUB_TOKEN", "").strip()
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          data = get_json(f"https://api.github.com/repos/{owner}/{repo}")
          if data.get("private") is not False:
              raise SystemExit("El repositorio no es público.")

          requested_branch = os.environ.get("REQUESTED_BRANCH", "").strip()
          branch_is_default = not requested_branch
          branch = requested_branch or str(data.get("default_branch") or "")
          forbidden_ref_chars = "~^:?*[]\\ "
          if (not re.fullmatch(r"[A-Za-z0-9._/-]{1,128}", branch)
              or branch.startswith("/") or branch.endswith("/") or "//" in branch or ".." in branch
              or branch.endswith(".") or "@{" in branch
              or any(char in branch for char in forbidden_ref_chars)
              or any(part in {"", ".", ".."} or part.startswith(".") or part.lower().endswith(".lock") for part in branch.split("/"))):
              raise SystemExit("Nombre de rama no válido.")

          project_path = os.environ.get("PROJECT_PATH", "").strip()
          if project_path and (
              len(project_path) > 240 or project_path.startswith("/") or project_path.endswith("/")
              or "\\" in project_path or any(ord(char) < 32 for char in project_path)
              or any(part in {"", ".", ".."} for part in project_path.split("/"))
          ):
              raise SystemExit("Ruta de proyecto no válida.")

          branch_ref = urllib.parse.quote(branch, safe="")
          try:
              get_json(f"https://api.github.com/repos/{owner}/{repo}/branches/{branch_ref}")
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  raise SystemExit(f"No existe la rama {branch}.")
              raise

          project_file_path = (project_path + "/" if project_path else "") + "project.godot"
          encoded_path = urllib.parse.quote(project_file_path, safe="/")
          try:
              project_file = get_json(f"https://api.github.com/repos/{owner}/{repo}/contents/{encoded_path}?ref={branch_ref}")
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  raise SystemExit(f"No se encontró {project_file_path} en la rama {branch}.")
              raise

          project_text = base64.b64decode(project_file.get("content", "")).decode("utf-8", errors="replace")
          with open("/tmp/godot-project.godot", "w", encoding="utf-8") as project_config:
              project_config.write(project_text)
          name_match = re.search(r'^\s*config/name\s*=\s*"([^"\r\n]+)"', project_text, re.MULTILINE)
          project_name = re.sub(r'[\r\n]+', ' ', name_match.group(1)).strip()[:80] if name_match else repo
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"owner={owner}\nrepo={repo}\nfull_name={owner}/{repo}\nbranch={branch}\nbranch_is_default={str(branch_is_default).lower()}\nproject_path={project_path}\nproject_name={project_name}\n")
          print(f"Proyecto Godot validado: {owner}/{repo} (rama {branch}, ruta {project_file_path}, nombre: {project_name})")
          PY

      - name: Descubrir mapa de entradas del proyecto
        id: input_map
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/godot-input-map.cjs /tmp/godot-project.godot > artifacts/project-input-map.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/project-input-map.json").read_text())
          print("Acciones declaradas:", data["action_count"])
          lines = ["# Mapa de entradas detectado", "", "Los nombres de acciones son etiquetas del proyecto, no una garantía de su función.", "", "| Acción | Controles declarados |", "|---|---|"]
          for action in data["actions"]:
              controls = [event.get("descriptor", {}).get("control", event["type"]) for event in action["events"]]
              device_names = sorted({event.get("descriptor", {}).get("device", "other") for event in action["events"]})
              summary = ", ".join(controls) if controls else "sin eventos reconocidos"
              lines.append("| " + action["name"] + " | " + summary + " (" + ", ".join(device_names) + ") |")
              print("- " + action["name"] + ": " + summary)
          Path("artifacts/project-input-map-summary.md").write_text("\n".join(lines) + "\n")
          PY
          echo "input_map=generated" >> "$GITHUB_OUTPUT"

      - name: Preparar perfil de controles de regresión
        id: control_profile
        env:
          REPOSITORY_FULL_NAME: ${{ steps.repo.outputs.full_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          profile = json.loads(Path("tests/control-profiles/escondite-smoke.json").read_text())
          selected_repo = os.environ.get("REPOSITORY_FULL_NAME", "").strip().lower()
          profile_repo = str(profile.get("repository", "")).strip().lower()
          if not selected_repo:
              raise SystemExit("No se pudo identificar el repositorio para seleccionar su perfil de controles.")
          # Smoke profiles belong to one project; never send another game's
          # controls to an unrelated project when this workflow is reused.
          actions = profile.get("actions", []) if profile_repo == selected_repo else []
          if not isinstance(actions, list) or len(actions) > 200:
              raise SystemExit("El perfil de controles no contiene una lista válida de acciones.")
          serialized = json.dumps(actions, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("actions=" + serialized + "\n")
          if actions:
              print(f"Perfil cargado: {profile.get('profile')} ({len(actions)} acciones)")
          else:
              print(f"Perfil omitido: {profile.get('profile')} pertenece a {profile_repo or 'ningún repositorio'}, no a {selected_repo}. No se enviarán controles ajenos.")
          PY

      - name: Verificar Relay desplegado con rama y subcarpeta
        id: relay_live
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import io, json, os, urllib.request, zipfile
          url = "https://godot-web-ia-relay.onrender.com/v1/github/decuvilan-lgtm/Godot-web-ia-integrada/archive?branch=main&path=tests%2Ffixtures%2Fnested-godot-project"
          result = {"url": url, "status": "failed"}
          try:
              request = urllib.request.Request(url, headers={"Origin": "https://godot-web-ia-integrada-rt2l.onrender.com", "User-Agent": "Godot-Web-Live-Relay-Check"})
              with urllib.request.urlopen(request, timeout=90) as response:
                  body = response.read()
                  result["httpStatus"] = response.status
                  result["selectedBranch"] = response.headers.get("X-GitHub-Ref")
                  result["selectedRepository"] = response.headers.get("X-GitHub-Repository")
                  result["corsExposeHeaders"] = response.headers.get("Access-Control-Expose-Headers", "")
                  result["bytes"] = len(body)
                  with zipfile.ZipFile(io.BytesIO(body)) as archive:
                      names = set(archive.namelist())
                  result["projectAtZipRoot"] = "project.godot" in names
                  result["nestedProjectRepacked"] = result["projectAtZipRoot"] and "main.gd" in names and "main.tscn" in names
                  if response.status != 200 or result["selectedBranch"] != "main" or result["selectedRepository"] != "decuvilan-lgtm/Godot-web-ia-integrada" or not result["projectAtZipRoot"] or not result["nestedProjectRepacked"]:
                      raise RuntimeError("El Relay público no cumple el contrato de rama/subcarpeta.")
                  if "x-github-ref" not in result["corsExposeHeaders"].lower():
                      raise RuntimeError("X-GitHub-Ref no está expuesta a CORS.")
                  result["status"] = "passed"
          except Exception as error:
              result["error"] = str(error)
              with open("artifacts/live-relay-check.json", "w", encoding="utf-8") as file:
                  json.dump(result, file, ensure_ascii=False, indent=2)
              raise
          with open("artifacts/live-relay-check.json", "w", encoding="utf-8") as file:
              json.dump(result, file, ensure_ascii=False, indent=2)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("result=passed\n")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Diagnosticar el ZIP real del proyecto y sus fuentes
        id: project_archive
        continue-on-error: true
        env:
          OWNER: ${{ steps.repo.outputs.owner }}
          REPO: ${{ steps.repo.outputs.repo }}
          BRANCH: ${{ steps.repo.outputs.branch }}
          PROJECT_PATH: ${{ steps.repo.outputs.project_path }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import hashlib, json, os, urllib.parse, urllib.request, zipfile
          owner = os.environ["OWNER"]
          repo = os.environ["REPO"]
          branch = os.environ["BRANCH"]
          project_path = os.environ.get("PROJECT_PATH", "")
          query = urllib.parse.urlencode({"branch": branch, "path": project_path})
          url = f"https://godot-web-ia-relay.onrender.com/v1/github/{owner}/{repo}/archive?{query}"
          result = {"url": url, "status": "failed", "expectedFont": "assets/fonts/Inter-Medium.otf"}
          try:
              request = urllib.request.Request(url, headers={
                  "Origin": "https://godot-web-ia-integrada-rt2l.onrender.com",
                  "User-Agent": "Godot-Web-Project-Archive-Diagnostic",
              })
              with urllib.request.urlopen(request, timeout=90) as response:
                  body = response.read()
                  result["httpStatus"] = response.status
                  result["archiveBytes"] = len(body)
              with open("artifacts/selected-project-source.zip", "wb") as archive_file:
                  archive_file.write(body)
              import io
              with zipfile.ZipFile(io.BytesIO(body)) as archive:
                  entries = archive.infolist()
                  names = {item.filename for item in entries}
                  result["entryCount"] = len(names)
                  result["directoryEntries"] = sorted(
                      item.filename for item in entries if item.is_dir()
                  )
                  result["requiredParentDirectoriesPresent"] = {
                      "assets/": "assets/" in names,
                      "assets/fonts/": "assets/fonts/" in names,
                  }
                  result["projectFilePresent"] = "project.godot" in names
                  result["themeFilePresent"] = "assets/ui_theme.tres" in names
                  result["fontFilePresent"] = "assets/fonts/Inter-Medium.otf" in names
                  result["crcError"] = archive.testzip()
                  if result["fontFilePresent"]:
                      font_info = archive.getinfo("assets/fonts/Inter-Medium.otf")
                      result["fontEntry"] = {
                          "fileSize": font_info.file_size,
                          "compressType": font_info.compress_type,
                          "flagBits": font_info.flag_bits,
                          "externalAttributes": font_info.external_attr,
                          "headerOffset": font_info.header_offset,
                      }
                      font = archive.read("assets/fonts/Inter-Medium.otf")
                      result["fontBytes"] = len(font)
                      result["fontSha256"] = hashlib.sha256(font).hexdigest()
                      result["fontGitBlobSha1"] = hashlib.sha1(
                          f"blob {len(font)}\0".encode() + font
                      ).hexdigest()
                      result["fontMatchesSourceBlob"] = (
                          len(font) == 627988
                          and result["fontGitBlobSha1"] == "8108180e92360cad0c7792945fe072c69f2087b5"
                      )
              result["status"] = "passed" if (
                      result["projectFilePresent"]
                      and result["themeFilePresent"]
                      and result["fontFilePresent"]
                      and result.get("fontMatchesSourceBlob") is True
                      and result["crcError"] is None
                  ) else "failed"
          except Exception as error:
              result["error"] = str(error)
          with open("artifacts/project-archive-diagnostic.json", "w", encoding="utf-8") as file:
              json.dump(result, file, ensure_ascii=False, indent=2)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("result=" + result["status"] + "\n")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Preparar navegador Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get install -y xvfb imagemagick

      - name: Preparar OCR para inspeccionar el Project Manager
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m venv .venv
          . .venv/bin/activate
          pip install --disable-pip-version-check pillow pytesseract

      - name: Ejecutar Godot Web e importar el proyecto
        id: browser
        env:
          OWNER: ${{ steps.repo.outputs.owner }}
          REPO: ${{ steps.repo.outputs.repo }}
          PROJECT_NAME: ${{ steps.repo.outputs.project_name }}
          BRANCH: ${{ steps.repo.outputs.branch }}
          BRANCH_IS_DEFAULT: ${{ steps.repo.outputs.branch_is_default }}
          PROJECT_PATH: ${{ steps.repo.outputs.project_path }}
          LIVE_RELAY_CHECK: ${{ steps.relay_live.outputs.result || 'failed' }}
          STARTUP_TIMEOUT: ${{ inputs.startup_timeout || '180' }}
          EDITOR_FRAMES: ${{ inputs.editor_frames || '5' }}
          EDITOR_INTERVAL_MS: ${{ inputs.editor_interval_ms || '900' }}
          GAME_FRAMES: ${{ inputs.game_frames || '8' }}
          GAME_INTERVAL_MS: ${{ inputs.game_interval_ms || '500' }}
          GAMEPLAY_DURATION_MS: ${{ inputs.gameplay_duration_ms || '16000' }}
          GAMEPLAY_ACTIONS_JSON: ${{ inputs.gameplay_actions_json || (github.event_name == 'push' && steps.control_profile.outputs.actions) || '[]' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/videos
          cat > /tmp/run-godot-web-check.cjs <<'JS'
          const { chromium } = require('playwright');
          const { execFileSync } = require('child_process');
          const fs = require('fs');
          const pathModule = require('path');
          const { runGameplayTimeline } = require(process.env.GITHUB_WORKSPACE + '/scripts/gameplay-test-controller.cjs');
          const timeout = Math.max(60, Math.min(300, Number(process.env.STARTUP_TIMEOUT || 180))) * 1000;
          const boundedInt = (name, fallback, min, max) => {
            const value = Number(process.env[name] || fallback);
            return Number.isFinite(value) ? Math.max(min, Math.min(max, Math.trunc(value))) : fallback;
          };
          const editorFrames = boundedInt('EDITOR_FRAMES', 5, 1, 12);
          const editorIntervalMs = boundedInt('EDITOR_INTERVAL_MS', 900, 100, 5000);
          const gameFrames = boundedInt('GAME_FRAMES', 8, 1, 24);
          const gameIntervalMs = boundedInt('GAME_INTERVAL_MS', 500, 100, 5000);
          const repoName = process.env.REPO;
          const projectLabel = process.env.PROJECT_NAME || repoName;
          const normalizeLabel = value => String(value || '').toLowerCase().replace(/[^a-z0-9]/g, '');
          const normalizedProjectLabel = normalizeLabel(projectLabel);
          if (normalizedProjectLabel.length < 2) throw new Error('El nombre del repositorio no permite una identificación visual segura.');
          const repo = `${process.env.OWNER}/${repoName}`;
          const importParams = new URLSearchParams({ repo });
          if (process.env.BRANCH) importParams.set('branch', process.env.BRANCH);
          if (process.env.PROJECT_PATH) importParams.set('path', process.env.PROJECT_PATH);
          const target = `https://godot-web-ia-integrada-rt2l.onrender.com/?${importParams.toString()}`;
          function inspectImage(path) {
            return JSON.parse(execFileSync('python3', ['scripts/godot_web_ocr.py', path], {
              encoding: 'utf8',
              env: { ...process.env, PATH: `${process.cwd()}/.venv/bin:${process.env.PATH}` }
            }));
          }
          async function saveSessionVideo(video) {
            if (!video) return;
            let temporaryPath = null;
            try { temporaryPath = await video.path(); } catch {}
            const targetPath = pathModule.resolve('artifacts/videos/render-session.webm');
            await video.saveAs(targetPath);
            if (temporaryPath && pathModule.resolve(temporaryPath) !== targetPath && fs.existsSync(temporaryPath)) {
              fs.unlinkSync(temporaryPath);
            }
          }
          function findLine(scan, pattern, label) {
            const line = scan.lines.find(item => pattern.test(item.text));
            if (!line) throw new Error(`No se encontró "${label}". OCR: ${scan.text}`);
            return line;
          }
          async function captureSequence(page, label, count, intervalMs) {
            const cdp = await page.context().newCDPSession(page);
            const frames = [];
            const startedAt = Date.now();
            const timeoutCall = async (promise, ms, message) => {
              let timer;
              try {
                return await Promise.race([
                  promise,
                  new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(message)), ms); })
                ]);
              } finally {
                if (timer) clearTimeout(timer);
              }
            };
            try {
              for (let index = 0; index < count; index++) {
                const filename = `artifacts/${label}-${String(index + 1).padStart(2, '0')}.png`;
                const frameStartedAt = Date.now();
                try {
                  const shot = await timeoutCall(
                    cdp.send('Page.captureScreenshot', {
                      format: 'png',
                      fromSurface: true,
                      captureBeyondViewport: false,
                      optimizeForSpeed: true
                    }),
                    15000,
                    'sequence screenshot timeout'
                  );
                  const bytes = Buffer.from(shot.data, 'base64');
                  if (bytes.length < 1024 || bytes.toString('hex', 0, 8) !== '89504e470d0a1a0a') {
                    throw new Error('La captura no es un PNG válido o está vacía.');
                  }
                  const width = bytes.readUInt32BE(16);
                  const height = bytes.readUInt32BE(20);
                  if (width < 500 || height < 300) {
                    throw new Error(`Resolución inesperada: ${width}x${height}`);
                  }
                  fs.writeFileSync(filename, bytes);
                  frames.push({
                    index: index + 1,
                    file: filename,
                    capturedAt: new Date().toISOString(),
                    elapsedMs: Date.now() - frameStartedAt,
                    width,
                    height,
                    bytes: bytes.length
                  });
                } catch (error) {
                  frames.push({ index: index + 1, file: filename, error: String(error) });
                  break;
                }
                if (index + 1 < count) await new Promise(resolve => setTimeout(resolve, intervalMs));
              }
            } finally {
              try { await cdp.detach(); } catch {}
            }
            const capturedFrames = frames.filter(frame => frame.bytes > 0).length;
            const manifest = {              label,
              requestedFrames: count,
              capturedFrames,
              intervalMs,
              totalDurationMs: Date.now() - startedAt,
              complete: capturedFrames === count,
              frames
            };
            fs.writeFileSync(`artifacts/${label}-sequence.json`, JSON.stringify(manifest, null, 2));
            if (!manifest.complete) {
              throw new Error(`Secuencia incompleta ${label}: ${capturedFrames}/${count} imágenes. Revisa el manifiesto.`);
            }
            return manifest;
          }
          async function captureEditorSnapshot(page, options = {}) {
            const cdp = await page.context().newCDPSession(page);
            const deadline = Date.now() + (options.timeoutMs || 90000);
            const attempts = [];
            let lastScan = null;
            let lastMethod = null;
            const captureMethods = [
              ['playwright', async path => page.screenshot({ path, fullPage: false, timeout: 8000 })],
              ['cdp', async path => {
                const shot = await Promise.race([
                  cdp.send('Page.captureScreenshot', { format: 'png', fromSurface: true, captureBeyondViewport: false, optimizeForSpeed: true }),
                  new Promise((_, reject) => setTimeout(() => reject(new Error('CDP screenshot timeout')), 8000))
                ]);
                fs.writeFileSync(path, Buffer.from(shot.data, 'base64'));
              }],
              ['x11', async path => execFileSync('import', ['-window', 'root', path], { timeout: 15000 })]
            ];
            try {
              while (Date.now() < deadline) {
                for (const [method, capture] of captureMethods) {
                  const path = options.path || 'artifacts/godot-editor-open.png';
                  try {
                    await capture(path);
                    const scan = inspectImage(path);
                    lastScan = scan;
                    lastMethod = method;
