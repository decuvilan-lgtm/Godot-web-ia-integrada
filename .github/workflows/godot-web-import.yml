name: Importar repositorio en Godot Web

on:
  push:
    paths:
      - ".github/workflows/godot-web-import.yml"
  workflow_dispatch:
    inputs:
      repository_url:
        description: "URL de cualquier repositorio público de GitHub con proyecto Godot en la raíz (rama main)"
        required: true
        default: "https://github.com/gavilandavid89-pixel/Escondite"
        type: string
      startup_timeout:
        description: "Tiempo máximo de espera del arranque de Godot (segundos)"
        required: false
        default: "180"
        type: string
      editor_frames:
        description: "Cantidad de capturas consecutivas del editor (1-12)"
        required: false
        default: "5"
        type: string
      editor_interval_ms:
        description: "Intervalo entre capturas del editor en milisegundos"
        required: false
        default: "900"
        type: string
      game_frames:
        description: "Cantidad de capturas consecutivas del juego (1-24)"
        required: false
        default: "8"
        type: string
      game_interval_ms:
        description: "Intervalo entre capturas del juego en milisegundos"
        required: false
        default: "500"
        type: string

permissions:
  contents: read

concurrency:
  group: godot-web-import-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  import-and-check:
    name: Abrir Godot Web e importar ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obtener helper de inspección
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/godot_web_ocr.py
          sparse-checkout-cone-mode: false

      - name: Validar URL y repositorio público
        id: repo
        env:
          REPOSITORY_URL: ${{ inputs.repository_url || 'https://github.com/gavilandavid89-pixel/Escondite' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.request, urllib.error
          raw = os.environ["REPOSITORY_URL"].strip()
          match = re.fullmatch(r"https://github\.com/([A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?)/([A-Za-z0-9](?:[A-Za-z0-9._-]{0,98}[A-Za-z0-9])?)/?", raw)
          if not match:
              raise SystemExit("Usa una URL https://github.com/owner/repository (sin rutas adicionales).")
          owner, repo = match.groups()
          def get_json(url):
              req = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json", "User-Agent": "Godot-Web-Import-Action"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          data = get_json(f"https://api.github.com/repos/{owner}/{repo}")
          if data.get("private") is not False:
              raise SystemExit("El repositorio no es público.")
          branch = "main"
          try:
              get_json(f"https://api.github.com/repos/{owner}/{repo}/branches/{branch}")
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  raise SystemExit("El repositorio no tiene una rama main. El importador actual descarga main.")
              raise
          try:
              project_file = get_json(f"https://api.github.com/repos/{owner}/{repo}/contents/project.godot?ref={branch}")
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  raise SystemExit("No se encontró project.godot en la raíz de main. El workflow requiere un proyecto Godot en la raíz del repositorio.")
              raise
          import base64
          project_text = base64.b64decode(project_file.get("content", "")).decode("utf-8", errors="replace")
          name_match = re.search(r'^\s*config/name\s*=\s*"([^"\r\n]+)"', project_text, re.MULTILINE)
          project_name = re.sub(r'[\r\n]+', ' ', name_match.group(1)).strip()[:80] if name_match else repo
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"owner={owner}\nrepo={repo}\nfull_name={owner}/{repo}\nbranch={branch}\nproject_name={project_name}\n")
          print(f"Proyecto Godot validado: {owner}/{repo} (rama {branch}, nombre: {project_name})")
          PY

      - name: Preparar navegador Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get install -y xvfb imagemagick

      - name: Preparar OCR para inspeccionar el Project Manager
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m venv .venv
          . .venv/bin/activate
          pip install --disable-pip-version-check pillow pytesseract

      - name: Ejecutar Godot Web e importar el proyecto
        id: browser
        env:
          OWNER: ${{ steps.repo.outputs.owner }}
          REPO: ${{ steps.repo.outputs.repo }}
          PROJECT_NAME: ${{ steps.repo.outputs.project_name }}
          STARTUP_TIMEOUT: ${{ inputs.startup_timeout || '180' }}
          EDITOR_FRAMES: ${{ inputs.editor_frames || '5' }}
          EDITOR_INTERVAL_MS: ${{ inputs.editor_interval_ms || '900' }}
          GAME_FRAMES: ${{ inputs.game_frames || '8' }}
          GAME_INTERVAL_MS: ${{ inputs.game_interval_ms || '500' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cat > /tmp/run-godot-web-check.cjs <<'JS'
          const { chromium } = require('playwright');
          const { execFileSync } = require('child_process');
          const fs = require('fs');
          const timeout = Math.max(60, Math.min(300, Number(process.env.STARTUP_TIMEOUT || 180))) * 1000;
          const boundedInt = (name, fallback, min, max) => {
            const value = Number(process.env[name] || fallback);
            return Number.isFinite(value) ? Math.max(min, Math.min(max, Math.trunc(value))) : fallback;
          };
          const editorFrames = boundedInt('EDITOR_FRAMES', 5, 1, 12);
          const editorIntervalMs = boundedInt('EDITOR_INTERVAL_MS', 900, 100, 5000);
          const gameFrames = boundedInt('GAME_FRAMES', 8, 1, 24);
          const gameIntervalMs = boundedInt('GAME_INTERVAL_MS', 500, 100, 5000);
          const repoName = process.env.REPO;
          const projectLabel = process.env.PROJECT_NAME || repoName;
          const normalizeLabel = value => String(value || '').toLowerCase().replace(/[^a-z0-9]/g, '');
          const normalizedProjectLabel = normalizeLabel(projectLabel);
          if (normalizedProjectLabel.length < 2) throw new Error('El nombre del repositorio no permite una identificación visual segura.');
          const repo = `${process.env.OWNER}/${repoName}`;
          const target = `https://godot-web-ia-integrada-rt2l.onrender.com/?repo=${encodeURIComponent(repo)}`;
          function inspectImage(path) {
            return JSON.parse(execFileSync('python3', ['scripts/godot_web_ocr.py', path], {
              encoding: 'utf8',
              env: { ...process.env, PATH: `${process.cwd()}/.venv/bin:${process.env.PATH}` }
            }));
          }
          function findLine(scan, pattern, label) {
            const line = scan.lines.find(item => pattern.test(item.text));
            if (!line) throw new Error(`No se encontró "${label}". OCR: ${scan.text}`);
            return line;
          }
          async function captureSequence(page, label, count, intervalMs) {
            const cdp = await page.context().newCDPSession(page);
            const frames = [];
            const startedAt = Date.now();
            const timeoutCall = async (promise, ms, message) => {
              let timer;
              try {
                return await Promise.race([
                  promise,
                  new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(message)), ms); })
                ]);
              } finally {
                if (timer) clearTimeout(timer);
              }
            };
            try {
              for (let index = 0; index < count; index++) {
                const filename = `artifacts/${label}-${String(index + 1).padStart(2, '0')}.png`;
                const frameStartedAt = Date.now();
                try {
                  const shot = await timeoutCall(
                    cdp.send('Page.captureScreenshot', {
                      format: 'png',
                      fromSurface: true,
                      captureBeyondViewport: false,
                      optimizeForSpeed: true
                    }),
                    15000,
                    'sequence screenshot timeout'
                  );
                  const bytes = Buffer.from(shot.data, 'base64');
                  if (bytes.length < 1024 || bytes.toString('hex', 0, 8) !== '89504e470d0a1a0a') {
                    throw new Error('La captura no es un PNG válido o está vacía.');
                  }
                  const width = bytes.readUInt32BE(16);
                  const height = bytes.readUInt32BE(20);
                  if (width < 500 || height < 300) {
                    throw new Error(`Resolución inesperada: ${width}x${height}`);
                  }
                  fs.writeFileSync(filename, bytes);
                  frames.push({
                    index: index + 1,
                    file: filename,
                    capturedAt: new Date().toISOString(),
                    elapsedMs: Date.now() - frameStartedAt,
                    width,
                    height,
                    bytes: bytes.length
                  });
                } catch (error) {
                  frames.push({ index: index + 1, file: filename, error: String(error) });
                  break;
                }
                if (index + 1 < count) await new Promise(resolve => setTimeout(resolve, intervalMs));
              }
            } finally {
              try { await cdp.detach(); } catch {}
            }
            const capturedFrames = frames.filter(frame => frame.bytes > 0).length;
            const manifest = {
              label,
              requestedFrames: count,
              capturedFrames,
              intervalMs,
              totalDurationMs: Date.now() - startedAt,
              complete: capturedFrames === count,
              frames
            };
            fs.writeFileSync(`artifacts/${label}-sequence.json`, JSON.stringify(manifest, null, 2));
            if (!manifest.complete) {
              throw new Error(`Secuencia incompleta ${label}: ${capturedFrames}/${count} imágenes. Revisa el manifiesto.`);
            }
            return manifest;
          }
          async function clickLine(page, scan, pattern, label) {
            const line = findLine(scan, pattern, label);
            const pixelRatio = 1; // Chromium deviceScaleFactor used by this lightweight visual check.
            const point = { x: line.x / pixelRatio, y: line.y / pixelRatio, source: line.text };
            await page.mouse.click(point.x, point.y);
            return point;
          }
          (async () => {
            const browser = await chromium.launch({
              headless: false,
              args: ['--enable-webgl', '--enable-unsafe-swiftshader', '--use-gl=angle',
                '--use-angle=swiftshader', '--disable-dev-shm-usage', '--no-sandbox']
            });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
            page.setDefaultTimeout(15000);
            const events = [];
            page.on('console', msg => events.push({ type: 'console:' + msg.type(), text: msg.text() }));
            page.on('pageerror', error => events.push({ type: 'pageerror', text: String(error) }));
            page.on('requestfailed', request => events.push({ type: 'requestfailed', url: request.url(), error: request.failure()?.errorText }));
            let archiveStatus = null;
            page.on('response', response => {
              if (response.url().includes('/v1/github/') && response.url().endsWith('/archive')) {
                archiveStatus = response.status();
                events.push({ type: 'archive-response', status: archiveStatus, contentType: response.headers()['content-type'] });
              }
            });
            const result = { repository: repo, projectLabel, target, startedAt: new Date().toISOString() };
            try {
              const response = await page.goto(target, { waitUntil: 'domcontentloaded', timeout });
              result.httpStatus = response?.status() ?? null;
              await page.waitForSelector('#startButton', { state: 'attached', timeout });
              await page.waitForSelector('#zip-file', { state: 'attached', timeout });
              await page.waitForFunction(() => {
                const input = document.querySelector('#zip-file');
                return input?.files?.length === 1 && !new URLSearchParams(location.search).has('repo');
              }, null, { timeout });
              result.preloadConfirmed = true;
              result.browserIsolation = await page.evaluate(() => ({
                crossOriginIsolated: window.crossOriginIsolated,
                sharedArrayBufferAvailable: typeof SharedArrayBuffer !== 'undefined',
                secureContext: window.isSecureContext,
                origin: window.location.origin
              }));
              result.preloadedFilename = await page.locator('#zip-file').evaluate(el => el.files[0]?.name || null);
              result.connectorButtonPresent = await page.locator('#godot-connect-github').count() > 0;
              result.archiveStatus = archiveStatus;
              if (archiveStatus !== 200) throw new Error('El Relay no entregó el ZIP con HTTP 200.');
              if (!result.preloadedFilename?.endsWith('-main.zip')) throw new Error('El ZIP no quedó asignado al input oficial de Godot.');
              await page.waitForFunction(() => [...document.querySelectorAll('canvas')].some(c => {
                const r = c.getBoundingClientRect();
                return c.width > 500 && c.height > 300 && r.width > 500 && r.height > 300;
              }), null, { timeout });
              await page.waitForTimeout(10000);
              await page.screenshot({ path: 'artifacts/godot-project-manager.png', type: 'png', fullPage: false, animations: 'disabled', scale: 'css', timeout: 20000 });
              let scan = inspectImage('artifacts/godot-project-manager.png');
              result.projectManagerOcr = scan.text;
              fs.writeFileSync('artifacts/project-manager-ocr.json', JSON.stringify(scan, null, 2));
              if (/Important\s*-\s*Please read/i.test(scan.text)) {
                const welcome = page.getByRole('button', { name: /OK\s*-\s*Don't Show Again/i });
                if (await welcome.count()) {
                  await welcome.click({ timeout: 5000 });
                  await page.waitForTimeout(3000);
                  await page.screenshot({ path: 'artifacts/godot-project-manager.png', fullPage: true });
                  scan = inspectImage('artifacts/godot-project-manager.png');
                  result.projectManagerOcr = scan.text;
                }
              }
              if (/Install Project/i.test(scan.text)) {
                const nameLine = findLine(scan, /^Preload$/i, 'campo de nombre del proyecto');
                await page.mouse.click(nameLine.x, nameLine.y);
                await page.keyboard.press('Control+A');
                await page.keyboard.type(projectLabel);
                await page.keyboard.press('Tab');
                await page.waitForTimeout(1500);
                await page.screenshot({ path: 'artifacts/godot-install-dialog-ready.png', type: 'png', fullPage: false, animations: 'disabled', timeout: 20000 });
                scan = inspectImage('artifacts/godot-install-dialog-ready.png');
                result.installDialogOcr = scan.text;
                if (!normalizeLabel(scan.text).includes(normalizedProjectLabel)) throw new Error(`No se pudo establecer el nombre "${projectLabel}" en el diálogo de instalación. OCR: ` + scan.text);
                result.projectNameSet = projectLabel;
                const installLine = scan.lines.find(item => /^Install$/i.test(item.text));
                let clickPoint;
                if (installLine) {
                  clickPoint = await clickLine(page, scan, /^Install$/i, 'botón Install');
                } else {
                  const viewport = page.viewportSize();
                  clickPoint = { x: viewport.width * 0.569, y: viewport.height * 0.649, source: 'fallback: Install button in centered Godot dialog' };
                  await page.mouse.click(clickPoint.x, clickPoint.y);
                }
                result.installActionClicked = 'Install';
                result.installClickPoint = clickPoint;
                result.installButtonClicked = true;
                // Godot puede bloquear el hilo principal mientras sustituye el Project Manager por el editor.
                // No capturar aquí: primero confirmar el cambio mediante los logs del motor.
                await page.waitForTimeout(3000);
              } else if (/Install\s*&\s*Edit|Install\s+and\s+Edit/i.test(scan.text)) {
                await clickLine(page, scan, /Instal+l?\s*(?:&|and)\s*Edit/i, 'Install & Edit');
                result.installAndEditClicked = true;
              } else {
                throw new Error('No se reconoció el diálogo de instalación del Project Manager. OCR: ' + scan.text);
              }
              // Validación funcional independiente de las capturas.
              let editorLaunchConfirmed = false;
              for (let attempt = 0; attempt < 36; attempt++) {
                const editingEvent = events.find(event => (event.text || '').includes('Editing project: /home/web_user/'));
                const engineStarts = events.filter(event => /Godot Engine v4\.7\.2/i.test(event.text || '')).length;
                if (editingEvent && engineStarts >= 2) { editorLaunchConfirmed = true; break; }
                await page.waitForTimeout(3000);
              }
              result.editorLaunchConfirmed = editorLaunchConfirmed;
              result.engineStartCount = events.filter(event => /Godot Engine v4\.7\.2/i.test(event.text || '')).length;
              const openedProjectEvent = events.find(event => (event.text || '').includes('Editing project: /home/web_user/'));
              result.openedProjectPath = openedProjectEvent ? (openedProjectEvent.text.match(/Editing project: (.+)$/)?.[1] || null) : null;
              result.projectInstallConfirmed = Boolean(editorLaunchConfirmed && result.openedProjectPath);
              if (!result.projectInstallConfirmed) throw new Error(`No se confirmó que Godot abriera el proyecto "${repo}". No se acepta el clic como prueba de instalación.`);
              await page.waitForTimeout(15000);
              try {
                result.rendererResponsive = await Promise.race([
                  page.evaluate(() => ({
                    readyState: document.readyState,
                    canvasCount: document.querySelectorAll('canvas').length,
                    viewport: { width: window.innerWidth, height: window.innerHeight }
                  })),
                  new Promise((_, reject) => setTimeout(() => reject(new Error('probe timeout')), 10000))
                ]);
              } catch (probeError) {
                result.rendererResponsive = false;
                result.rendererWarning = String(probeError);
              }
              result.status = 'functional-launch-only';
              result.finishedAt = new Date().toISOString();
              fs.writeFileSync('artifacts/browser-events.json', JSON.stringify(events, null, 2));
              fs.writeFileSync('artifacts/result.json', JSON.stringify(result, null, 2));
              console.log('Godot informó que abrió el proyecto; la captura visual es obligatoria para aprobar la prueba completa.');
              try {
                // Use the Chrome DevTools protocol directly. Playwright's screenshot helper
                // injects a stylesheet through page JS, which can hang if Godot's WASM
                // main thread is busy during editor initialization.
                const cdp = await page.context().newCDPSession(page);
                const captured = await Promise.race([
                  cdp.send('Page.captureScreenshot', { format: 'png', fromSurface: true, captureBeyondViewport: false }),
                  new Promise((_, reject) => setTimeout(() => reject(new Error('CDP screenshot timeout')), 25000))
                ]);
                fs.writeFileSync('artifacts/godot-editor-open.png', Buffer.from(captured.data, 'base64'));
                await cdp.detach();
                const editorScan = inspectImage('artifacts/godot-editor-open.png');
                result.editorScreenshot = 'captured';
                result.editorOcr = editorScan.text;
                result.editorUiDetected = /2D|3D|Script|AssetLib|Scene|Inspector|FileSystem/i.test(editorScan.text);
                result.projectNameVisible = normalizeLabel(editorScan.text).includes(normalizedProjectLabel);
                fs.writeFileSync('artifacts/editor-ocr.json', JSON.stringify(editorScan, null, 2));

                if (!result.editorUiDetected || !result.projectNameVisible) {
                  throw new Error(`La captura existe, pero no demuestra la interfaz del editor con "${projectLabel}" visible. OCR: ` + editorScan.text);
                }
                result.editorSequence = await captureSequence(page, 'editor-sequence', editorFrames, editorIntervalMs);
                // Optional game-preview probe: F5 runs the project's configured main scene.
                // Failure here must not invalidate the verified editor screenshot.
                try {
                  const previewCdp = await page.context().newCDPSession(page);
                  await previewCdp.send('Input.dispatchKeyEvent', { type: 'keyDown', key: 'F5', code: 'F5', windowsVirtualKeyCode: 116 });
                  await previewCdp.send('Input.dispatchKeyEvent', { type: 'keyUp', key: 'F5', code: 'F5', windowsVirtualKeyCode: 116 });
                  await page.waitForTimeout(10000);
                  const previewShot = await Promise.race([
                    previewCdp.send('Page.captureScreenshot', { format: 'png', fromSurface: true, captureBeyondViewport: false }),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('game preview capture timeout')), 15000))
                  ]);
                  fs.writeFileSync('artifacts/godot-game-preview.png', Buffer.from(previewShot.data, 'base64'));
                  const previewScan = inspectImage('artifacts/godot-game-preview.png');
                  result.gamePreviewScreenshot = 'captured';
                  result.gamePreviewOcr = previewScan.text;
                  fs.writeFileSync('artifacts/game-preview-ocr.json', JSON.stringify(previewScan, null, 2));
                  await previewCdp.detach();
                  result.gamePreviewSequence = await captureSequence(page, 'game-preview-sequence', gameFrames, gameIntervalMs);
                } catch (previewError) {
                  result.gamePreviewScreenshot = 'warning';
                  result.gamePreviewWarning = String(previewError);
                }
              } catch (captureError) {
                result.captureWarning = String(captureError);
                // A partial sequence is a real test failure, not a reason to silently
                // downgrade the result to a single X11 screenshot.
                if (String(captureError).includes('Secuencia incompleta')) throw captureError;
                // Last-resort capture from the X11 desktop. This does not need
                // JavaScript execution or a responsive Chromium renderer.
                try {
                  execFileSync('import', ['-window', 'root', 'artifacts/godot-editor-open.png'], { timeout: 15000 });
                  const editorScan = inspectImage('artifacts/godot-editor-open.png');
                  result.editorScreenshot = 'captured-x11';
                  result.editorOcr = editorScan.text;
                  result.editorUiDetected = /2D|3D|Script|AssetLib|Scene|Inspector|FileSystem/i.test(editorScan.text);
                  result.projectNameVisible = normalizeLabel(editorScan.text).includes(normalizedProjectLabel);
                  fs.writeFileSync('artifacts/editor-ocr.json', JSON.stringify(editorScan, null, 2));
                  if (!result.editorUiDetected || !result.projectNameVisible) {
                    throw new Error(`X11 capturó la pantalla, pero no encontró el editor con "${projectLabel}". OCR: ` + editorScan.text);
                  }
                } catch (x11Error) {
                  result.editorScreenshot = 'failed';
                  result.x11CaptureWarning = String(x11Error);
                  result.status = 'failed';
                  result.finishedAt = new Date().toISOString();
                  fs.writeFileSync('artifacts/browser-events.json', JSON.stringify(events, null, 2));
                  fs.writeFileSync('artifacts/result.json', JSON.stringify(result, null, 2));
                  throw x11Error;
                }
              }
              result.status = 'passed';
              result.finishedAt = new Date().toISOString();
              fs.writeFileSync('artifacts/browser-events.json', JSON.stringify(events, null, 2));
              fs.writeFileSync('artifacts/result.json', JSON.stringify(result, null, 2));
              result.finishedAt = new Date().toISOString();
              fs.writeFileSync('artifacts/browser-events.json', JSON.stringify(events, null, 2));
              fs.writeFileSync('artifacts/result.json', JSON.stringify(result, null, 2));
              console.log(JSON.stringify(result, null, 2));
              await browser.close();
            } catch (error) {
              result.status = 'failed';
              result.error = String(error?.stack || error);
              result.finishedAt = new Date().toISOString();
              try {
                await page.screenshot({ path: 'artifacts/godot-web-import-failure.png', fullPage: true });
                const failureScan = inspectImage('artifacts/godot-web-import-failure.png');
                result.failureOcr = failureScan.text;
                fs.writeFileSync('artifacts/failure-ocr.json', JSON.stringify(failureScan, null, 2));
              } catch (captureError) { result.captureError = String(captureError); }
              fs.writeFileSync('artifacts/browser-events.json', JSON.stringify(events, null, 2));
              fs.writeFileSync('artifacts/result.json', JSON.stringify(result, null, 2));
              await browser.close();
              throw error;
            }
          })().catch(error => { console.error(error); process.exit(1); });
          JS
          . .venv/bin/activate
          xvfb-run -a --server-args="-screen 0 1600x1000x24" env NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/run-godot-web-check.cjs


      - name: Crear hojas de contacto de las secuencias
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          editor_frames=(artifacts/editor-sequence-*.png)
          game_frames=(artifacts/game-preview-sequence-*.png)
          if [ "${#editor_frames[@]}" -gt 0 ]; then
            montage "${editor_frames[@]}" -tile 5x -geometry 480x300+8+8 artifacts/editor-sequence-contact-sheet.png
          fi
          if [ "${#game_frames[@]}" -gt 0 ]; then
            montage "${game_frames[@]}" -tile 4x -geometry 480x300+8+8 artifacts/game-preview-sequence-contact-sheet.png
          fi

      - name: Publicar enlace de apertura y resultado
        if: always()
        env:
          OWNER: ${{ steps.repo.outputs.owner }}
          REPO: ${{ steps.repo.outputs.repo }}
          BRANCH: ${{ steps.repo.outputs.branch }}
          PROJECT_NAME: ${{ steps.repo.outputs.project_name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Importación Godot Web"
            echo
            if [ -n "${OWNER:-}" ] && [ -n "${REPO:-}" ]; then
              echo "- Repositorio: https://github.com/${OWNER}/${REPO}"
              echo "- Rama: ${BRANCH:-main}"
              echo "- Nombre del proyecto Godot: ${PROJECT_NAME:-${REPO}}"
              echo "- Abrir en Godot Web: https://godot-web-ia-integrada-rt2l.onrender.com/?repo=${OWNER}%2F${REPO}"
            fi
            echo "- Resultado del workflow: **${JOB_STATUS}**"
            echo
            if [ "$JOB_STATUS" = "success" ]; then
              echo "La prueba confirmó la precarga del ZIP, la apertura de ${OWNER}/${REPO} y una captura OCR verificable del editor."
            else
              echo "La prueba no consiguió una captura verificable del repositorio seleccionado con el proyecto abierto. Revisa el diagnóstico adjunto."
            fi
            if [ -f artifacts/result.json ]; then
              python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/result.json").read_text())
          print()
          print("### Secuencias visuales")
          for key, label in (("editorSequence", "Editor"), ("gamePreviewSequence", "Juego")):
              sequence = data.get(key)
              if sequence:
                  print(f"- {label}: {sequence.get('capturedFrames', 0)}/{sequence.get('requestedFrames', 0)} imágenes; intervalo {sequence.get('intervalMs')} ms; completa: {sequence.get('complete', False)}")
              else:
                  print(f"- {label}: sin secuencia confirmada")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar capturas y diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-import-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
