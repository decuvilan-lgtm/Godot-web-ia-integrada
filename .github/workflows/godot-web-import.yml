              const dimensions = execFileSync('identify', ['-format', '%w %h', filename], { encoding: 'utf8' }).trim().split(/\s+/).map(Number);
              const stat = fs.statSync(filename);
              if (stat.size < 1024 || dimensions[0] < 500 || dimensions[1] < 300) throw new Error(`Captura Playwright inválida: ${dimensions.join('x')} (${stat.size} bytes)`);
              frames.push({ index: index + 1, file: filename, capturedAt: new Date().toISOString(), width: dimensions[0], height: dimensions[1], bytes: stat.size });
              if (index + 1 < count) await new Promise(resolve => setTimeout(resolve, intervalMs));
            }
            const manifest = { label, requestedFrames: count, capturedFrames: frames.length, intervalMs, totalDurationMs: Date.now() - startedAt, complete: frames.length === count, frames, captureMethod: 'playwright' };
            fs.writeFileSync(`artifacts/${label}-sequence.json`, JSON.stringify(manifest, null, 2));
            if (!manifest.complete) throw new Error(`Secuencia Playwright incompleta ${label}: ${frames.length}/${count}`);
