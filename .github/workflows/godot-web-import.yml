name: Importar repositorio en Godot Web

on:
  push:
    paths:
      - ".github/workflows/godot-web-import.yml"
  workflow_dispatch:
    inputs:
      repository_url:
        description: "URL de un repositorio público de GitHub (se importará desde main)"
        required: true
        default: "https://github.com/gavilandavid89-pixel/Escondite"
        type: string
      startup_timeout:
        description: "Tiempo máximo de espera del arranque de Godot (segundos)"
        required: false
        default: "180"
        type: string

permissions:
  contents: read

concurrency:
  group: godot-web-import-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  import-and-check:
    name: Abrir Godot Web e importar ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obtener helper de inspección
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/godot_web_ocr.py
          sparse-checkout-cone-mode: false

      - name: Validar URL y repositorio público
        id: repo
        env:
          REPOSITORY_URL: ${{ inputs.repository_url || 'https://github.com/gavilandavid89-pixel/Escondite' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.request, urllib.error
          raw = os.environ["REPOSITORY_URL"].strip()
          match = re.fullmatch(r"https://github\.com/([A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?)/([A-Za-z0-9](?:[A-Za-z0-9._-]{0,98}[A-Za-z0-9])?)/?", raw)
          if not match:
              raise SystemExit("Usa una URL https://github.com/owner/repository (sin rutas adicionales).")
          owner, repo = match.groups()
          def get_json(url):
              req = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json", "User-Agent": "Godot-Web-Import-Action"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          data = get_json(f"https://api.github.com/repos/{owner}/{repo}")
          if data.get("private") is not False:
              raise SystemExit("El repositorio no es público.")
          try:
              get_json(f"https://api.github.com/repos/{owner}/{repo}/branches/main")
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  raise SystemExit("El repositorio no tiene una rama main. El importador actual usa main exclusivamente.")
              raise
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"owner={owner}\nrepo={repo}\nfull_name={owner}/{repo}\n")
          print(f"Repositorio público validado: {owner}/{repo} (main)")
          PY

      - name: Preparar navegador Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get install -y xvfb imagemagick xdotool

      - name: Preparar OCR para inspeccionar el Project Manager
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m venv .venv
          . .venv/bin/activate
          pip install --disable-pip-version-check pillow pytesseract

      - name: Ejecutar Godot Web e importar el proyecto
        id: browser
        env:
          OWNER: ${{ steps.repo.outputs.owner }}
          REPO: ${{ steps.repo.outputs.repo }}
          STARTUP_TIMEOUT: ${{ inputs.startup_timeout || '180' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cat > /tmp/run-godot-web-check.cjs <<'JS'
          const { chromium } = require('playwright');
          const { execFileSync } = require('child_process');
          const fs = require('fs');
          const timeout = Math.max(60, Math.min(300, Number(process.env.STARTUP_TIMEOUT || 180))) * 1000;
          const repo = `${process.env.OWNER}/${process.env.REPO}`;
          const target = `https://godot-web-ia-integrada-rt2l.onrender.com/?repo=${encodeURIComponent(repo)}`;
          function inspectImage(path) {
            return JSON.parse(execFileSync('python3', ['scripts/godot_web_ocr.py', path], {
              encoding: 'utf8',
              env: { ...process.env, PATH: `${process.cwd()}/.venv/bin:${process.env.PATH}` }
            }));
          }
          function findLine(scan, pattern, label) {
            const line = scan.lines.find(item => pattern.test(item.text));
            if (!line) throw new Error(`No se encontró "${label}". OCR: ${scan.text}`);
            return line;
          }
          async function clickLine(page, scan, pattern, label) {
            const line = findLine(scan, pattern, label);
            const pixelRatio = 1; // Chromium deviceScaleFactor used by this lightweight visual check.
            const point = { x: line.x / pixelRatio, y: line.y / pixelRatio, source: line.text };
            await page.mouse.click(point.x, point.y);
            return point;
          }
          (async () => {
            const browser = await chromium.launch({
              headless: false,
              args: ['--enable-webgl', '--enable-unsafe-swiftshader', '--use-gl=angle',
                '--use-angle=swiftshader', '--disable-dev-shm-usage', '--no-sandbox']
            });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
            page.setDefaultTimeout(15000);
            const events = [];
            page.on('console', msg => events.push({ type: 'console:' + msg.type(), text: msg.text() }));
            page.on('pageerror', error => events.push({ type: 'pageerror', text: String(error) }));
            page.on('requestfailed', request => events.push({ type: 'requestfailed', url: request.url(), error: request.failure()?.errorText }));
            let archiveStatus = null;
            page.on('response', response => {
              if (response.url().includes('/v1/github/') && response.url().endsWith('/archive')) {
                archiveStatus = response.status();
                events.push({ type: 'archive-response', status: archiveStatus, contentType: response.headers()['content-type'] });
              }
            });
            const result = { repository: repo, target, startedAt: new Date().toISOString() };
            try {
              const response = await page.goto(target, { waitUntil: 'domcontentloaded', timeout });
              result.httpStatus = response?.status() ?? null;
              await page.waitForSelector('#startButton', { state: 'attached', timeout });
              await page.waitForSelector('#zip-file', { state: 'attached', timeout });
              await page.waitForFunction(() => {
                const input = document.querySelector('#zip-file');
                return input?.files?.length === 1 && !new URLSearchParams(location.search).has('repo');
              }, null, { timeout });
              result.preloadConfirmed = true;
              result.browserIsolation = await page.evaluate(() => ({
                crossOriginIsolated: window.crossOriginIsolated,
                sharedArrayBufferAvailable: typeof SharedArrayBuffer !== 'undefined',
                secureContext: window.isSecureContext,
                origin: window.location.origin
              }));
              result.preloadedFilename = await page.locator('#zip-file').evaluate(el => el.files[0]?.name || null);
              result.connectorButtonPresent = await page.locator('#godot-connect-github').count() > 0;
              result.archiveStatus = archiveStatus;
              if (archiveStatus !== 200) throw new Error('El Relay no entregó el ZIP con HTTP 200.');
              if (!result.preloadedFilename?.endsWith('-main.zip')) throw new Error('El ZIP no quedó asignado al input oficial de Godot.');
              await page.waitForFunction(() => [...document.querySelectorAll('canvas')].some(c => {
                const r = c.getBoundingClientRect();
                return c.width > 500 && c.height > 300 && r.width > 500 && r.height > 300;
              }), null, { timeout });
              await page.waitForTimeout(10000);
              await page.screenshot({ path: 'artifacts/godot-project-manager.png', type: 'png', fullPage: false, animations: 'disabled', scale: 'css', timeout: 20000 });
              let scan = inspectImage('artifacts/godot-project-manager.png');
              result.projectManagerOcr = scan.text;
              fs.writeFileSync('artifacts/project-manager-ocr.json', JSON.stringify(scan, null, 2));
              if (/Important\s*-\s*Please read/i.test(scan.text)) {
                const welcome = page.getByRole('button', { name: /OK\s*-\s*Don't Show Again/i });
                if (await welcome.count()) {
                  await welcome.click({ timeout: 5000 });
                  await page.waitForTimeout(3000);
                  await page.screenshot({ path: 'artifacts/godot-project-manager.png', fullPage: true });
                  scan = inspectImage('artifacts/godot-project-manager.png');
                  result.projectManagerOcr = scan.text;
                }
              }
              if (/Install Project/i.test(scan.text)) {
                const nameLine = findLine(scan, /^Preload$/i, 'campo de nombre del proyecto');
                await page.mouse.click(nameLine.x, nameLine.y);
                await page.keyboard.press('Control+A');
                await page.keyboard.type('Dragon Realm');
                await page.keyboard.press('Tab');
                await page.waitForTimeout(1500);
                await page.screenshot({ path: 'artifacts/godot-install-dialog-ready.png', type: 'png', fullPage: false, animations: 'disabled', timeout: 20000 });
                scan = inspectImage('artifacts/godot-install-dialog-ready.png');
                result.installDialogOcr = scan.text;
                if (!/Dragon Realm/i.test(scan.text)) throw new Error('No se pudo establecer el nombre Dragon Realm en el diálogo de instalación. OCR: ' + scan.text);
                result.projectNameSet = 'Dragon Realm';
                const installLine = scan.lines.find(item => /^Install$/i.test(item.text));
                let clickPoint;
                if (installLine) {
                  clickPoint = await clickLine(page, scan, /^Install$/i, 'botón Install');
                } else {
                  const viewport = page.viewportSize();
                  clickPoint = { x: viewport.width * 0.569, y: viewport.height * 0.649, source: 'fallback: Install button in centered Godot dialog' };
                  await page.mouse.click(clickPoint.x, clickPoint.y);
                }
                result.installActionClicked = 'Install';
                result.installClickPoint = clickPoint;
                result.installButtonClicked = true;
                // Godot puede bloquear el hilo principal mientras sustituye el Project Manager por el editor.
                // No capturar aquí: primero confirmar el cambio mediante los logs del motor.
                await page.waitForTimeout(3000);
              } else if (/Install\s*&\s*Edit|Install\s+and\s+Edit/i.test(scan.text)) {
                await clickLine(page, scan, /Instal+l?\s*(?:&|and)\s*Edit/i, 'Install & Edit');
                result.installAndEditClicked = true;
              } else {
                throw new Error('No se reconoció el diálogo de instalación del Project Manager. OCR: ' + scan.text);
              }
              // Validación funcional independiente de las capturas.
              let editorLaunchConfirmed = false;
              for (let attempt = 0; attempt < 36; attempt++) {
                const editingLogged = events.some(event => (event.text || '').includes('Editing project: /home/web_user/dragon-realm'));
                const engineStarts = events.filter(event => /Godot Engine v4\.7\.2/i.test(event.text || '')).length;
                if (editingLogged && engineStarts >= 2) { editorLaunchConfirmed = true; break; }
                await page.waitForTimeout(3000);
              }
              result.editorLaunchConfirmed = editorLaunchConfirmed;
              result.engineStartCount = events.filter(event => /Godot Engine v4\.7\.2/i.test(event.text || '')).length;
              result.projectInstallConfirmed = Boolean(editorLaunchConfirmed && events.some(event => (event.text || '').includes('Editing project: /home/web_user/dragon-realm')));
              if (!result.projectInstallConfirmed) throw new Error('No se confirmó que Godot abriera Dragon Realm; no se acepta el clic como prueba de instalación.');
              await page.waitForTimeout(15000);
              try {
                result.rendererResponsive = await Promise.race([
                  page.evaluate(() => ({
                    readyState: document.readyState,
                    canvasCount: document.querySelectorAll('canvas').length,
                    viewport: { width: window.innerWidth, height: window.innerHeight }
                  })),
                  new Promise((_, reject) => setTimeout(() => reject(new Error('probe timeout')), 10000))
                ]);
              } catch (probeError) {
                result.rendererResponsive = false;
                result.rendererWarning = String(probeError);
              }
              result.status = 'functional-launch-only';
              result.finishedAt = new Date().toISOString();
              fs.writeFileSync('artifacts/browser-events.json', JSON.stringify(events, null, 2));
              fs.writeFileSync('artifacts/result.json', JSON.stringify(result, null, 2));
              console.log('Godot informó que abrió el proyecto; la captura visual es obligatoria para aprobar la prueba completa.');
              try {
                // Use the Chrome DevTools protocol directly. Playwright's screenshot helper
                // injects a stylesheet through page JS, which can hang if Godot's WASM
                // main thread is busy during editor initialization.
                const cdp = await page.context().newCDPSession(page);
                const captured = await Promise.race([
                  cdp.send('Page.captureScreenshot', { format: 'png', fromSurface: true, captureBeyondViewport: false }),
                  new Promise((_, reject) => setTimeout(() => reject(new Error('CDP screenshot timeout')), 25000))
                ]);
                fs.writeFileSync('artifacts/godot-editor-open.png', Buffer.from(captured.data, 'base64'));
                await cdp.detach();
                const editorScan = inspectImage('artifacts/godot-editor-open.png');
                result.editorScreenshot = 'captured';
                result.editorOcr = editorScan.text;
                result.editorUiDetected = /2D|3D|Script|AssetLib|Scene|Inspector|FileSystem/i.test(editorScan.text);
                result.projectNameVisible = /Dragon\s*Realm/i.test(editorScan.text);
                fs.writeFileSync('artifacts/editor-ocr.json', JSON.stringify(editorScan, null, 2));
                if (!result.editorUiDetected || !result.projectNameVisible) {
                  throw new Error('La captura existe, pero no demuestra la interfaz del editor con Dragon Realm visible. OCR: ' + editorScan.text);
                }
              } catch (captureError) {
                result.captureWarning = String(captureError);
                // Last-resort capture from the X11 desktop. This does not need
                // JavaScript execution or a responsive Chromium renderer.
                try {
                  execFileSync('import', ['-window', 'root', 'artifacts/godot-editor-open.png'], { timeout: 15000 });
                  const editorScan = inspectImage('artifacts/godot-editor-open.png');
                  result.editorScreenshot = 'captured-x11';
                  result.editorOcr = editorScan.text;
                  result.editorUiDetected = /2D|3D|Script|AssetLib|Scene|Inspector|FileSystem/i.test(editorScan.text);
                  result.projectNameVisible = /Dragon Realm/i.test(editorScan.text);
                  fs.writeFileSync('artifacts/editor-ocr.json', JSON.stringify(editorScan, null, 2));
                  // Try switching the visible workspace to the 2D scene view through real X11 input.
                  try {
                    execFileSync('xdotool', ['mousemove', '607', '154', 'click', '1'], { timeout: 5000 });
                    await page.waitForTimeout(2000);
                    execFileSync('import', ['-window', 'root', 'artifacts/godot-editor-2d.png'], { timeout: 15000 });
                    const sceneScan = inspectImage('artifacts/godot-editor-2d.png');
                    result.editor2dOcr = sceneScan.text;
                    result.editor2dScreenshot = 'captured-x11';
                    fs.writeFileSync('artifacts/editor-2d-ocr.json', JSON.stringify(sceneScan, null, 2));
                  } catch (sceneCaptureError) {
                    result.editor2dScreenshot = 'warning';
                    result.editor2dCaptureWarning = String(sceneCaptureError);
                  }
                  if (!result.editorUiDetected || !result.projectNameVisible) {
                    throw new Error('X11 capturó la pantalla, pero no encontró el editor con Dragon Realm. OCR: ' + editorScan.text);
                  }
                } catch (x11Error) {
                  result.editorScreenshot = 'failed';
                  result.x11CaptureWarning = String(x11Error);
                  result.status = 'failed';
                  result.finishedAt = new Date().toISOString();
                  fs.writeFileSync('artifacts/browser-events.json', JSON.stringify(events, null, 2));
                  fs.writeFileSync('artifacts/result.json', JSON.stringify(result, null, 2));
                  throw x11Error;
                }
              }
              result.status = 'passed';
              result.finishedAt = new Date().toISOString();
              fs.writeFileSync('artifacts/browser-events.json', JSON.stringify(events, null, 2));
              fs.writeFileSync('artifacts/result.json', JSON.stringify(result, null, 2));
              result.finishedAt = new Date().toISOString();
              fs.writeFileSync('artifacts/browser-events.json', JSON.stringify(events, null, 2));
              fs.writeFileSync('artifacts/result.json', JSON.stringify(result, null, 2));
              console.log(JSON.stringify(result, null, 2));
              await browser.close();
            } catch (error) {
              result.status = 'failed';
              result.error = String(error?.stack || error);
              result.finishedAt = new Date().toISOString();
              try {
                await page.screenshot({ path: 'artifacts/godot-web-import-failure.png', fullPage: true });
                const failureScan = inspectImage('artifacts/godot-web-import-failure.png');
                result.failureOcr = failureScan.text;
                fs.writeFileSync('artifacts/failure-ocr.json', JSON.stringify(failureScan, null, 2));
              } catch (captureError) { result.captureError = String(captureError); }
              fs.writeFileSync('artifacts/browser-events.json', JSON.stringify(events, null, 2));
              fs.writeFileSync('artifacts/result.json', JSON.stringify(result, null, 2));
              await browser.close();
              throw error;
            }
          })().catch(error => { console.error(error); process.exit(1); });
          JS
          . .venv/bin/activate
          xvfb-run -a --server-args="-screen 0 1600x1000x24" env NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/run-godot-web-check.cjs


      - name: Publicar enlace de apertura y resultado
        if: always()
        env:
          OWNER: ${{ steps.repo.outputs.owner }}
          REPO: ${{ steps.repo.outputs.repo }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Importación Godot Web"
            echo
            if [ -n "${OWNER:-}" ] && [ -n "${REPO:-}" ]; then
              echo "- Repositorio: https://github.com/${OWNER}/${REPO}"
              echo "- Rama: main"
              echo "- Abrir en Godot Web: https://godot-web-ia-integrada-rt2l.onrender.com/?repo=${OWNER}%2F${REPO}"
            fi
            echo "- Resultado del workflow: **${JOB_STATUS}**"
            echo
            if [ "$JOB_STATUS" = "success" ]; then
              echo "La prueba confirmó la precarga del ZIP, la apertura del proyecto y una captura OCR verificable del editor."
            else
              echo "La prueba no consiguió una captura verificable del editor con el proyecto abierto. Revisa el diagnóstico adjunto."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar capturas y diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-import-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
