              frames.push({ index: index + 1, file: filename, capturedAt: new Date().toISOString(), width: dimensions[0], height: dimensions[1], bytes: stat.size });
              if (index + 1 < count) await new Promise(resolve => setTimeout(resolve, intervalMs));
