name: Validate persistent session workflows

on:
  push:
    branches:
      - test/verdant-valley-development-benchmark
    paths:
      - ".github/workflows/persistent-session-operator.yml"
      - ".github/workflows/persistent-session-host.yml"
      - ".github/workflows/persistent-session-validation.yml"
      - "relay/persistent_sessions.py"
      - "relay/test_persistent_sessions.py"
      - "scripts/patch-web-shell.py"
      - "scripts/test_patch_web_shell.py"
      - "docs/persistent-godot-session.md"
      - "render-relay.yaml"
  pull_request:
    paths:
      - ".github/workflows/persistent-session-operator.yml"
      - ".github/workflows/persistent-session-host.yml"
      - ".github/workflows/persistent-session-validation.yml"
      - "relay/persistent_sessions.py"
      - "relay/test_persistent_sessions.py"
      - "docs/persistent-godot-session.md"
      - "render-relay.yaml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate workflow YAML and embedded Python clients
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python -m compileall -q relay/persistent_sessions.py
          python -m pip install --disable-pip-version-check -r relay/requirements.txt
          (cd relay && python -m unittest -v test_persistent_sessions)
          python scripts/test_patch_web_shell.py
          python - <<'PY'
          from pathlib import Path
          import re, textwrap, yaml

          workflow_dir=Path(".github/workflows")
          workflows=sorted(workflow_dir.glob("*.yml"))+sorted(workflow_dir.glob("*.yaml"))
          for path in workflows:
              parsed=yaml.load(path.read_text(encoding="utf-8"),Loader=yaml.BaseLoader)
              if not isinstance(parsed,dict):
                  raise SystemExit(f"{path}: workflow root must be a mapping")
              print(f"YAML PASS: {path}")

          workflow_jobs = {
              "persistent-session-operator.yml": "operate",
              "persistent-session-host.yml": "host",
          }
          for name, job_name in workflow_jobs.items():
              path=workflow_dir/name
              parsed=yaml.load(path.read_text(encoding="utf-8"),Loader=yaml.BaseLoader)
              steps=parsed.get("jobs",{}).get(job_name,{}).get("steps",[])
              scripts=[]
              for step in steps:
                  command=step.get("run","")
                  match=re.search(r"python3 - <<'PY'\n(.*?)\nPY",command,re.S)
                  if match:
                      scripts.append(textwrap.dedent(match.group(1)))
              if len(scripts)!=1:
                  raise SystemExit(f"{path}: expected exactly one embedded Python client, found {len(scripts)}")
              compile(scripts[0],str(path)+"::<embedded-python>","exec")
              print(f"EMBEDDED PYTHON PASS: {path}")

          relay_source=Path("relay/persistent_sessions.py").read_text(encoding="utf-8")
          operator_source=Path(".github/workflows/persistent-session-operator.yml").read_text(encoding="utf-8")
          host_source=Path(".github/workflows/persistent-session-host.yml").read_text(encoding="utf-8")
          render_source=Path("render-relay.yaml").read_text(encoding="utf-8")
          docs=Path("docs/persistent-godot-session.md").read_text(encoding="utf-8")
          editor_patcher=Path("scripts/patch-web-shell.py").read_text(encoding="utf-8")
          relay_url="https://godot-web-ia-relay-test.onrender.com"
          required_checks = {
              "configurable per-session API duration": "duration_seconds: int = Field(default=DEFAULT_SESSION_DURATION_SECONDS" in relay_source,
              "default duration is 600 seconds": '"PERSISTENT_SESSION_DEFAULT_DURATION_SECONDS", "600"' in relay_source,
              "per-session duration is stored": "max_duration_seconds=body.duration_seconds" in relay_source,
              "expiry uses each session duration": "now - session.created_at >= session.max_duration_seconds" in relay_source,
              "idle cleanup cannot pre-empt configured duration": "IDLE_TTL = max(MAX_SESSION_DURATION_SECONDS" in relay_source,
              "Workflow B has no session creation action": 'if op=="open"' not in operator_source,
              "Workflow B exposes coordinate click": 'op=="click"' in operator_source and '"command":"click"' in operator_source,
              "Workflow B exposes text entry": 'op=="type_text"' in operator_source and '"command":"type_text"' in operator_source,
              "Workflow B exposes keyboard input": 'op=="press_key"' in operator_source and '"command":"press_key"' in operator_source,
              "Workflow B exposes scroll and drag": 'op=="scroll"' in operator_source and 'op=="drag"' in operator_source,
              "Relay validates mouse bounds": "_validate_mouse_point" in relay_source and "outside the editor viewport" in relay_source,
              "Workflow A exposes configurable duration": "duration_minutes:" in host_source and "default: 10" in host_source,
              "Workflow A sends selected duration": '"duration_seconds":duration*60' in host_source,
              "Workflow A resolves the selected branch to an immutable SHA": 'effective_sha=str(json.load(response).get("commit",{}).get("sha","")).lower()' in host_source,
              "Workflow A sends the immutable SHA to Relay": '"commit_sha":effective_sha' in host_source,
              "Relay waits for exact project import": 'readiness["imported_sha"] == expected_sha' in relay_source and "canvas_count >= 1" in relay_source,
              "Readiness monitor runs independently": 'asyncio.create_task(_wait_for_editor_ready(session, effective_sha))' in relay_source,
              "Readiness task is retained": "_readiness_tasks.add(readiness_task)" in relay_source,
              "Readiness tasks cancel on shutdown": "await asyncio.gather(*readiness_tasks, return_exceptions=True)" in relay_source,
              "Import timeout starts after page navigation": "session.loading_started_at = time.time()" in relay_source,
              "Operator commands require ready editor": 'session.created_at is None' in relay_source and 'still importing' in relay_source,
              "Workflow A waits for loading state": 'while status.get("state") == "loading"' in host_source,
              "Workflow A allows open request timeout": '},timeout=180)' in host_source,
              "Workflow A keeps a host heartbeat": 'heartbeat","POST' in host_source,
              "Workflow A closes its session at deadline": '"DELETE"' in host_source,
              "Workflow A targets the deployed test Relay": relay_url in host_source and "godot-web-ia-relay.onrender.com" not in host_source,
              "Workflow B targets the deployed test Relay": relay_url in operator_source and "godot-web-ia-relay.onrender.com" not in operator_source,
              "Godot editor connector targets the deployed test Relay": relay_url in editor_patcher and "godot-web-ia-relay.onrender.com" not in editor_patcher,
              "Relay allowlists Workflow A identity": "persistent-session-host.yml" in relay_source,
              "Render configures default only": "PERSISTENT_SESSION_DEFAULT_DURATION_SECONDS" in render_source,
              "docs explain duration can be changed": "change" in docs and "340 minutes" in docs,
          }
          for label, passed in required_checks.items():
              if not passed:
                  raise SystemExit(f"CONFIGURATION CHECK FAILED: {label}")
              print(f"CONFIGURATION CHECK PASS: {label}")
          PY
