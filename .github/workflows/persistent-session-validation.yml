name: Validate persistent session workflows

on:
  push:
    branches:
      - test/verdant-valley-development-benchmark
    paths:
      - ".github/workflows/persistent-session-operator.yml"
      - ".github/workflows/persistent-session-host.yml"
      - ".github/workflows/persistent-session-validation.yml"
      - "relay/persistent_sessions.py"
      - "relay/native_remote.py"
      - "relay/test_native_remote.py"
      - "scripts/bridge/native_remote_agent.py"
      - "relay/test_persistent_sessions.py"
      - "relay/native_remote.py"
      - "relay/test_native_remote.py"
      - "scripts/patch-web-shell.py"
      - "scripts/test_patch_web_shell.py"
      - "scripts/godot-browser-worker.py"
      - "scripts/bridge/browser_command_loop.py"
      - "scripts/bridge/test_browser_command_loop.py"
      - "scripts/bridge/test_semantic_controller.py"
      - "scripts/bridge/semantic_controller.py"
      - "scripts/build/patch_godot_web_agent.py"
      - "scripts/build/smoke_test_godot_web_agent.py"
      - "tests/test_web_agent_patcher.py"
      - "browser-extension/page-bridge.js"
      - "scripts/bridge/native_editor_client.py"
      - "tests/test_native_editor_client.py"
      - "headless/native-editor/tools/headless_bridge/README.md"
      - "docs/persistent-godot-session.md"
      - "docs/native-remote-editor.md"
      - "scripts/bridge/native_editor_client.py"
      - "tests/test_native_editor_client.py"
      - "headless/native-editor/tools/headless_bridge/README.md"
      - "render-relay.yaml"
  pull_request:
    paths:
      - ".github/workflows/persistent-session-operator.yml"
      - ".github/workflows/persistent-session-host.yml"
      - ".github/workflows/persistent-session-validation.yml"
      - "relay/persistent_sessions.py"
      - "relay/test_persistent_sessions.py"
      - "docs/persistent-godot-session.md"
      - "render-relay.yaml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate workflow YAML and embedded Python clients
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python -m compileall -q relay/persistent_sessions.py relay/native_remote.py
          python -m py_compile scripts/godot-browser-worker.py scripts/bridge/browser_command_loop.py scripts/bridge/semantic_controller.py scripts/bridge/native_editor_client.py scripts/bridge/native_remote_agent.py scripts/build/patch_godot_web_agent.py scripts/build/smoke_test_godot_web_agent.py
          (cd scripts/bridge && python -m unittest -v test_browser_command_loop test_semantic_controller)
          python -m unittest -v tests.test_native_editor_client
          python -m pip install --disable-pip-version-check -r relay/requirements.txt
          (cd relay && python -m unittest -v test_persistent_sessions test_native_remote)
          python scripts/test_patch_web_shell.py
          python -m unittest discover -s tests -p "test_web_agent_patcher.py" -v
          node --check browser-extension/page-bridge.js
          python - <<'PY'
          from pathlib import Path
          import re, textwrap, yaml

          workflow_dir=Path(".github/workflows")
          workflows=sorted(workflow_dir.glob("*.yml"))+sorted(workflow_dir.glob("*.yaml"))
          for path in workflows:
              parsed=yaml.load(path.read_text(encoding="utf-8"),Loader=yaml.BaseLoader)
              if not isinstance(parsed,dict):
                  raise SystemExit(f"{path}: workflow root must be a mapping")
              print(f"YAML PASS: {path}")

          workflow_jobs = {
              "persistent-session-operator.yml": "operate",
              "persistent-session-host.yml": "host",
          }
          for name, job_name in workflow_jobs.items():
              path=workflow_dir/name
              parsed=yaml.load(path.read_text(encoding="utf-8"),Loader=yaml.BaseLoader)
              steps=parsed.get("jobs",{}).get(job_name,{}).get("steps",[])
              scripts=[]
              for step in steps:
                  command=step.get("run","")
                  match=re.search(r"python3 - <<'PY'\n(.*?)\nPY",command,re.S)
                  if match:
                      scripts.append(textwrap.dedent(match.group(1)))
              if len(scripts)!=1:
                  raise SystemExit(f"{path}: expected exactly one embedded Python client, found {len(scripts)}")
              compile(scripts[0],str(path)+"::<embedded-python>","exec")
              print(f"EMBEDDED PYTHON PASS: {path}")

          relay_source=Path("relay/persistent_sessions.py").read_text(encoding="utf-8")
          operator_source=Path(".github/workflows/persistent-session-operator.yml").read_text(encoding="utf-8")
          host_source=Path(".github/workflows/persistent-session-host.yml").read_text(encoding="utf-8")
          worker_source=Path("scripts/godot-browser-worker.py").read_text(encoding="utf-8")
          command_loop_source=Path("scripts/bridge/browser_command_loop.py").read_text(encoding="utf-8")
          web_agent_patcher=Path("scripts/build/patch_godot_web_agent.py").read_text(encoding="utf-8")
          render_source=Path("render-relay.yaml").read_text(encoding="utf-8")
          docs=Path("docs/persistent-godot-session.md").read_text(encoding="utf-8")
          editor_patcher=Path("scripts/patch-web-shell.py").read_text(encoding="utf-8")
          relay_url="https://godot-web-ia-relay-test.onrender.com"
          required_checks = {
              "configurable per-session API duration": "duration_seconds: int = Field(default=DEFAULT_SESSION_DURATION_SECONDS" in relay_source,
              "default duration is 600 seconds": '"PERSISTENT_SESSION_DEFAULT_DURATION_SECONDS", "600"' in relay_source,
              "expiry uses each session duration": "now - session.created_at >= session.max_duration_seconds" in relay_source,
              "idle cleanup cannot pre-empt configured duration": "IDLE_TTL = max(MAX_SESSION_DURATION_SECONDS" in relay_source,
              "Workflow B uses a branch-scoped request file": '".session-operator-request.json"' in operator_source,
              "Workflow B sends commands through the issue channel": "issues/" in operator_source and '"protocol":1' in operator_source and '"action":action' in operator_source,
          "Workflow B supports coordinate-free semantic inspection": '"semantic-inspect"' in operator_source and '"editor.get_state"' in operator_source and '"scene.get_tree"' in operator_source,
          "Workflow B semantic inspection is coordinate-free": "semantic_read_allowlist" in operator_source and '"semantic-inspect"' in operator_source,
          "Workflow B supports one scoped semantic edit": '"semantic-edit"' in operator_source and '"scene.add_node"' in operator_source and "allowed_node_types" in operator_source,
          "Built-in Godot Web agent implements undoable scene node creation": "scene.add_node" in web_agent_patcher and "EditorUndoRedoManager *undo_redo = get_undo_redo()" in web_agent_patcher and "undo_redo->add_do_reference(created)" in web_agent_patcher,
              "Workflow B exposes canvas click and keyboard actions": 'send("canvas_click",x=0.02,y=0.02)' in operator_source and 'send("press_key",key="Escape")' in operator_source,
              "Workflow B waits for A ready marker": "godot-browser-host-ready" in operator_source,
              "Workflow B waits for a correlated browser result": "godot-browser-result" in operator_source and "command_id" in operator_source,
              "Workflow A runs Chromium on the GitHub runner": "scripts/godot-browser-worker.py" in host_source and "runs-on: ubuntu-24.04" in host_source,
              "Workflow A uses only the test editor and Relay": "godot-web-ia-editor-test.onrender.com" in host_source and "godot-web-ia-relay-test.onrender.com" in host_source and "godot-web-ia-relay.onrender.com" not in host_source,
              "Workflow A imports an immutable project revision": "resolve_sha()" in worker_source and '"expected_sha":sha' in worker_source,
              "Workflow A keeps the browser available for B": "BROWSER_COMMAND_WINDOW_SECONDS" in host_source and "run_command_loop" in worker_source,
              "Workflow A publishes its ready marker": "post_host_ready_comment" in worker_source,
              "Workflow A keeps browser commands available after optional warnings": "if browser_ready and not page.is_closed()" in worker_source and "semantic_controller_probe" in worker_source,
              "Workflow A stores evidence in GitHub Actions": "SKIP_RELAY_ARTIFACT_UPLOAD" in host_source and "artifact_storage" in worker_source,
              "Workflow B isolates concurrency by request revision": "group: godot-session-operator-" in operator_source and "cancel-in-progress: false" in operator_source,
              "Workflow A exports request variables safely": "chr(10)" in host_source,
              "Workflow A retries transient Relay startup failures": "404,502,503,504" in worker_source,
              "Workflow A authenticates branch SHA lookup": '"Authorization":"Bearer "+os.environ.get("GITHUB_TOKEN","")' in worker_source,
              "A and B share the same browser session ID": "session_id" in operator_source and "session_id" in command_loop_source,
              "The issue command loop trusts the user and GitHub Actions bot": 'TRUSTED_ACTORS={"decuvilan-lgtm","github-actions[bot]"}' in command_loop_source,
              "Relay validates mouse bounds": "_validate_mouse_point" in relay_source and "outside the editor viewport" in relay_source,
              "Godot editor dispatches both input and change events": 'new Event("input", { bubbles: true })' in editor_patcher and 'new Event("change", { bubbles: true })' in editor_patcher,
              "Relay allowlists Workflow A identity": "persistent-session-host.yml" in relay_source,
              "Render configures the session default": "PERSISTENT_SESSION_DEFAULT_DURATION_SECONDS" in render_source,
          }
          for label, passed in required_checks.items():
              if not passed:
                  raise SystemExit(f"CONFIGURATION CHECK FAILED: {label}")
              print(f"CONFIGURATION CHECK PASS: {label}")
          PY
