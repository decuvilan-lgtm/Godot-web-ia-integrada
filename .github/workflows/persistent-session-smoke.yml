name: Godot Web browser worker
run-name: Godot browser worker \${{ github.run_id }}

on:
  push:
    branches: [main]
    paths:
      - relay/worker_artifacts.py
      - scripts/godot-browser-worker.py
      - relay/persistent_sessions.py
      - relay/requirements.txt
      - relay/github_archives.py
      - scripts/patch-web-shell.py
      - render-relay.yaml
      - .github/workflows/persistent-session-smoke.yml
  workflow_dispatch:
    inputs:
      repository:
        description: Public GitHub repository containing the Godot project (owner/repository)
        required: true
        default: gavilandavid89-pixel/Ajedrez-2c2
        type: string
      branch:
        description: Branch to import
        required: false
        default: main
        type: string
      commit_sha:
        description: Optional full immutable Git commit SHA
        required: false
        default: ''
        type: string
      project_path:
        description: Folder containing project.godot
        required: false
        default: ajedrez_2c2_v161
        type: string
      wait_seconds:
        description: Initial editor settle delay
        required: false
        default: '10'
        type: string
      import_timeout_seconds:
        description: Maximum import wait (60-600 seconds)
        required: false
        default: '480'
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: godot-browser-worker-\${{ github.run_id }}
  cancel-in-progress: false

jobs:
  browser-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out lab controller
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.52.0-\${{ runner.os }}
      - name: Install browser worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.52.0
          python -m playwright install --with-deps chromium
      - name: Open Godot Web in runner-owned Chromium and persist evidence
        env:
          REPOSITORY: \${{ inputs.repository || 'gavilandavid89-pixel/Ajedrez-2c2' }}
          BRANCH: \${{ inputs.branch || 'main' }}
          COMMIT_SHA: \${{ inputs.commit_sha || '' }}
          PROJECT_PATH: \${{ inputs.project_path || 'ajedrez_2c2_v161' }}
          WAIT_SECONDS: \${{ inputs.wait_seconds || '10' }}
          IMPORT_TIMEOUT_SECONDS: \${{ inputs.import_timeout_seconds || '480' }}
          RELAY_URL: https://godot-web-ia-relay.onrender.com
          EDITOR_URL: https://godot-web-ia-integrada-rt2l.onrender.com/
        run: python scripts/godot-browser-worker.py
      - name: Upload runner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-browser-worker-\${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
