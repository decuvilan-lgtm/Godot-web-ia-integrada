name: Configure Neon Storage CORS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/configure-neon-storage-cors.yml
      - relay/storage_cors.py

permissions:
  contents: read

jobs:
  configure-cors:
    name: Apply and verify private bucket CORS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install S3 client
        run: python -m pip install --disable-pip-version-check "boto3==1.38.27"

      - name: Configure and verify exact CORS policy
        working-directory: relay
        env:
          AWS_ENDPOINT_URL_S3: https://br-dark-shadow-b567bp59.storage.c-7.us-east-2.aws.neon.tech
          AWS_REGION: us-east-2
          AWS_ACCESS_KEY_ID: ${{ secrets.NEON_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NEON_S3_SECRET_ACCESS_KEY }}
          COMMAND_CENTER_STORAGE_CORS_ORIGIN: https://godot-web-ia-integrada-rt2l.onrender.com
          NEON_EXPECTED_ACCESS_KEY_SHA256: 83dae869f91209090ebe5cd5f21c6b657203b7dc0412103bf719a8e7ee2b687c
        shell: bash
        run: |
          # Trim accidental whitespace without ever printing credential material.
          export AWS_ACCESS_KEY_ID="$(python -c 'import os; print(os.environ.get("AWS_ACCESS_KEY_ID", "").strip())')"
          export AWS_SECRET_ACCESS_KEY="$(python -c 'import os; print(os.environ.get("AWS_SECRET_ACCESS_KEY", "").strip())')"

          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::error::Missing repository secrets NEON_S3_ACCESS_KEY_ID and/or NEON_S3_SECRET_ACCESS_KEY."
            exit 1
          fi

          # Verify the GitHub Access Key ID matches the active Neon credential.
          ACTUAL_KEY_HASH="$(python -c 'import hashlib, os; print(hashlib.sha256(os.environ["AWS_ACCESS_KEY_ID"].encode()).hexdigest())')"
          if [[ "$ACTUAL_KEY_HASH" != "$NEON_EXPECTED_ACCESS_KEY_SHA256" ]]; then
            echo "::error::NEON_S3_ACCESS_KEY_ID does not match the active Neon GitHub Actions credential."
            exit 1
          fi
          echo "Access Key ID matches the active Neon credential (value withheld)."

          python -m storage_cors
