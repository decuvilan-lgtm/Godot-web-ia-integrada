name: Configure Neon Storage CORS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/configure-neon-storage-cors.yml

permissions:
  contents: read

jobs:
  configure-cors:
    name: Apply and verify private bucket CORS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install S3 client
        run: python -m pip install --disable-pip-version-check "boto3==1.38.27"

      - name: Configure and verify exact CORS policy
        working-directory: relay
        env:
          AWS_ENDPOINT_URL_S3: https://br-dark-shadow-b567bp59.storage.c-7.us-east-2.aws.neon.tech
          AWS_REGION: us-east-2
          EXPECTED_NEON_ACCESS_KEY_ID: nak_live_15dfeddbbf1248a0a98bf8d459d75b52
          AWS_ACCESS_KEY_ID: ${{ secrets.NEON_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NEON_S3_SECRET_ACCESS_KEY }}
          COMMAND_CENTER_STORAGE_CORS_ORIGIN: https://godot-web-ia-integrada-rt2l.onrender.com
        shell: bash
        run: |
          # Remove accidental leading/trailing whitespace or copied line breaks.
          export AWS_ACCESS_KEY_ID="$(python -c 'import os; print(os.environ.get("AWS_ACCESS_KEY_ID", "").strip())')"
          export AWS_SECRET_ACCESS_KEY="$(python -c 'import os; print(os.environ.get("AWS_SECRET_ACCESS_KEY", "").strip())')"

          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::error::Missing repository secrets NEON_S3_ACCESS_KEY_ID and/or NEON_S3_SECRET_ACCESS_KEY."
            exit 1
          fi
          python - <<'PY'
          import hmac, os, sys
          actual = os.environ.get("AWS_ACCESS_KEY_ID", "")
          expected = os.environ["EXPECTED_NEON_ACCESS_KEY_ID"]
          if not hmac.compare_digest(actual, expected):
              print("::error::NEON_S3_ACCESS_KEY_ID does not match the active Neon credential after whitespace normalization.")
              sys.exit(1)
          print("Access key ID matches the active Neon credential.")
          PY
          python -m storage_cors
