name: Persistent Godot Session Operator (Workflow B)
run-name: Godot browser operator — ${{ github.run_id }}

on:
  push:
    branches:
      - test/verdant-valley-development-benchmark
    paths:
      - ".session-operator-request.json"

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: godot-session-operator-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out the test-branch request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Send commands to A's existing Chromium session and verify it remains open
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          AB_API_URL: https://br-falling-waterfall-b5x4fu2i-abbridge.compute.c-7.us-east-2.aws.neon.tech
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, time, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          from scripts.bridge.artifacts import (
              join_transport_session, enqueue_transport_command,
              fetch_transport_command_result, download_json_artifact,
              request_github_actions_oidc_token, issue_transport_device_token,
          )

          operator_started=time.monotonic()
          request_path=Path(".session-operator-request.json")
          if not request_path.is_file():
              print("No operator request file; ignoring request-file deletion event")
              raise SystemExit(0)
          request=json.loads(request_path.read_text(encoding="utf-8"))
          repo=os.environ["REPOSITORY"]
          if request.get("repository")!=repo:
              raise SystemExit("Operator request repository mismatch")
          if request.get("branch")!="test/verdant-valley-development-benchmark":
              raise SystemExit("Operator is restricted to the authorized test branch")
          session_id=request.get("session_id")
          issue_number=request.get("issue_number")
          operation=request.get("operation","inspect")
          if not isinstance(session_id,str) or not re.fullmatch(r"[A-Za-z0-9_-]{1,100}",session_id):
              raise SystemExit("Invalid browser session ID")
          if not isinstance(issue_number,int) or isinstance(issue_number,bool) or issue_number<1:
              raise SystemExit("Invalid command-channel issue number")
          if operation not in {"inspect","interaction-smoke","ui-action","semantic-inspect","semantic-edit","semantic-build","preview-smoke","latency-benchmark","stop"}:
              raise SystemExit("Unsupported operator verification operation")

          semantic_action=request.get("editor_action","editor.get_state")
          semantic_args=request.get("args",{})
          def validate_property_args(args):
              if not isinstance(args,dict) or set(args)!={"path","property","value"}:
                  raise SystemExit("scene.set_property requires path, property, and value")
              path=args["path"]; prop=args["property"]; value=args["value"]
              if not isinstance(path,str) or not path or len(path)>200 or path.startswith("/") or ".." in path.split("/") or "//" in path:
                  raise SystemExit("Property node path must stay inside the active scene")
              if not isinstance(prop,str) or not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]{0,79}",prop):
                  raise SystemExit("Property name must be a bounded identifier")
              if prop=="script":
                  raise SystemExit("Script assignment is not exposed through the semantic property editor")
              if value is None or isinstance(value,bool):
                  return
              if isinstance(value,(int,float)):
                  if abs(value)>1_000_000_000:
                      raise SystemExit("Property number exceeds safe range")
                  return
              if isinstance(value,str):
                  if len(value)>512:
                      raise SystemExit("Property strings are limited to 512 characters")
                  return
              if isinstance(value,list):
                  if not 2<=len(value)<=4 or any(not isinstance(v,(int,float)) or isinstance(v,bool) or abs(v)>1_000_000_000 for v in value):
                      raise SystemExit("Property vectors/colors need 2-4 bounded numeric components")
                  return
              if isinstance(value,dict):
                  resource_path=value.get("resource_path")
                  if set(value)!={"resource_path"} or not isinstance(resource_path,str) or not resource_path.startswith("res://") or len(resource_path)>512 or ".." in resource_path.split("/") or "\\" in resource_path:
                      raise SystemExit("Resource references must be bounded res:// paths")
                  return
              raise SystemExit("Unsupported Inspector property value shape")
          semantic_read_allowlist={"editor.get_state","editor.list_capabilities","scene.get_tree","scene.inspect_node"}
          if operation=="semantic-inspect":
              if semantic_action not in semantic_read_allowlist or not isinstance(semantic_args,dict):
                  raise SystemExit("Semantic inspection only permits allowlisted read-only editor queries")
              if semantic_action=="scene.inspect_node":
                  path=semantic_args.get("path")
                  if set(semantic_args)!={"path"} or not isinstance(path,str) or not path or len(path)>200 or path.startswith("/") or ".." in path.split("/") or "//" in path:
                      raise SystemExit("scene.inspect_node requires one bounded relative path inside the active scene")
              elif semantic_args!={}:
                  raise SystemExit("This read-only editor query does not accept arguments")
          if operation=="semantic-edit":
              if semantic_action=="scene.set_property":
                  validate_property_args(semantic_args)
              elif semantic_action=="scene.add_node":
                  if not isinstance(semantic_args,dict) or set(semantic_args)-{"node_type","node_name","parent_path"} or not {"node_type","node_name"}.issubset(semantic_args):
                      raise SystemExit("scene.add_node requires node_type and node_name, with optional parent_path")
                  if any(not isinstance(value,str) or not value or len(value)>200 for value in semantic_args.values()):
                      raise SystemExit("scene.add_node arguments must be bounded strings")
                  allowed_node_types={"Node","Node2D","Sprite2D","AnimatedSprite2D","Polygon2D","Line2D","CharacterBody2D","RigidBody2D","StaticBody2D","Area2D","CollisionShape2D","CollisionPolygon2D","RayCast2D","VisibleOnScreenNotifier2D","Camera2D","Marker2D","Path2D","PathFollow2D","TileMapLayer","Parallax2D","RemoteTransform2D","CanvasLayer","Control","Label","RichTextLabel","TextureRect","ColorRect","Panel","Button","TextureButton","ProgressBar","VBoxContainer","HBoxContainer","GridContainer","MarginContainer","CenterContainer","SubViewport","SubViewportContainer","AnimationPlayer","AnimationTree","Timer","AudioStreamPlayer","AudioStreamPlayer2D"}
                  if semantic_args["node_type"] not in allowed_node_types or not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]{0,47}",semantic_args["node_name"]):
                      raise SystemExit("Node type or name is not allowlisted")
                  if "parent_path" in semantic_args and (semantic_args["parent_path"].startswith("/") or ".." in semantic_args["parent_path"].split("/") or "//" in semantic_args["parent_path"]):
                      raise SystemExit("Parent path must stay inside the edited scene root")
              else:
                  raise SystemExit("Semantic edit must use scene.add_node or scene.set_property")
          api="https://api.github.com"
          token=os.environ["GITHUB_TOKEN"]
          headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json",
                   "User-Agent":"Godot-Session-Operator"}
          def api_call(path,method="GET",payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(api+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=30) as response:
                  raw=response.read()
                  return json.loads(raw) if raw else {}

          issue_path=f"/repos/{repo}/issues/{issue_number}/comments"
          ready_marker="<!-- godot-browser-host-ready -->"
          ready_started=time.monotonic()
          ready_deadline=ready_started+900
          ready_poll_seconds=2.0
          ready_marker_wait_ms=None
          comments=[]
          transport_session_id=None
          while time.monotonic()<ready_deadline:
              issue_state=api_call(f"/repos/{repo}/issues/{issue_number}")
              if issue_state.get("state")=="closed":
                  raise RuntimeError("Workflow A closed the command channel before publishing its ready marker")
              comments=api_call(issue_path+"?per_page=100&sort=created&direction=asc")
              if not isinstance(comments,list):
                  raise RuntimeError("Could not read the browser command channel")
              ready=False
              for item in comments:
                  body=item.get("body") or ""
                  if ready_marker not in body:
                      continue
                  ready_payload=body.split(ready_marker,1)[1].strip()
                  if ready_payload.startswith(chr(92) + "n"):
                      ready_payload=ready_payload[2:].lstrip()
                  try: marker=json.loads(ready_payload)
                  except Exception: continue
                  if marker.get("session_id")==session_id and marker.get("commit_sha"):
                      transport_session_id=marker.get("transport_session_id")
                      ready=True
                      break
              if ready:
                  break
              time.sleep(ready_poll_seconds)
          else:
              raise TimeoutError("Workflow A did not publish a ready marker for this browser session")
          ready_marker_wait_ms=round((time.monotonic()-ready_started)*1000,2)
          neon_api=os.environ.get("AB_API_URL","").strip()
          neon_token=""
          if neon_api:
              oidc_token=request_github_actions_oidc_token()
              neon_token=issue_transport_device_token(
                  neon_api,oidc_token,expected_kind="agent_controller"
              )
          neon_mode=bool(neon_api and neon_token)
          if neon_mode:
              if not isinstance(transport_session_id,str) or not re.fullmatch(r"[0-9a-fA-F-]{36}",transport_session_id):
                  raise RuntimeError("Workflow A did not publish a valid Neon transport session ID")
              join_started=time.monotonic()
              join_transport_session(neon_api,neon_token,transport_session_id)
              neon_join_ms=round((time.monotonic()-join_started)*1000,2)
          else:
              neon_join_ms=None
          last_seq=0
          for item in comments:
              body=(item.get("body") or "").strip()
              if not body.startswith("{") or not body.endswith("}"):
                  continue
              try: command=json.loads(body)
              except Exception: continue
              if command.get("protocol")==1 and command.get("session_id")==session_id:
                  seq=command.get("seq")
                  if isinstance(seq,int) and not isinstance(seq,bool):
                      last_seq=max(last_seq,seq)

          command_timings=[]
          def send(action, **fields):
              send_started=time.monotonic()
              poll_count=0
              nonlocal_seq[0]+=1
              if neon_mode:
                  created=enqueue_transport_command(
                      neon_api, neon_token, session_id=transport_session_id,
                      target="web_editor", action=action, args=fields,
                      idempotency_key=f"{transport_session_id}:{os.environ.get('GITHUB_RUN_ID','manual')}:{nonlocal_seq[0]}",
                      ttl_seconds=240,
                  )
                  command_id=created["id"]
                  deadline=time.monotonic()+150
                  while time.monotonic()<deadline:
                      poll_count+=1
                      response=fetch_transport_command_result(neon_api,neon_token,command_id)
                      if response:
                          value=response.get("result") or {}
                          if isinstance(value,dict) and value.get("artifact_id"):
                              value=download_json_artifact(neon_api,neon_token,value["artifact_id"])
                          if not response.get("ok",False) or not isinstance(value,dict) or not value.get("ok",False):
                              raise RuntimeError("Browser command failed: "+str(value.get("error",response.get("error_message","unknown error"))))
                          elapsed_ms=round((time.monotonic()-send_started)*1000,2)
                          timing={"seq":nonlocal_seq[0],"action":action,"round_trip_ms":elapsed_ms,"result_polls":poll_count,"a_processing_ms":value.get("bridge_timing",{}).get("a_processing_ms")}
                          command_timings.append(timing)
                          value["_bridge_timing"]=timing
                          return value
                      time.sleep(0.25)
                  raise TimeoutError(f"Timed out waiting for Neon browser command {action}")
              command={"protocol":1,"session_id":session_id,"seq":nonlocal_seq[0],"action":action,**fields}
              created=api_call(issue_path,"POST",{"body":json.dumps(command,ensure_ascii=False)})
              command_id=created["id"]
              deadline=time.monotonic()+150
              while time.monotonic()<deadline:
                  poll_count+=1
                  current=api_call(issue_path+"?per_page=100&sort=created&direction=desc")
                  for comment in current:
                      body=comment.get("body") or ""
                      marker="<!-- godot-browser-result -->"
                      if marker not in body:
                          continue
                      try: result=json.loads(body.split(marker,1)[1].strip())
                      except Exception: continue
                      if result.get("command_id")==command_id:
                          value=result.get("result",{})
                          if not value.get("ok",False):
                              raise RuntimeError("Browser command failed: "+str(value.get("error","unknown error")))
                          elapsed_ms=round((time.monotonic()-send_started)*1000,2)
                          timing={"seq":nonlocal_seq[0],"action":action,"round_trip_ms":elapsed_ms,"result_polls":poll_count,"a_processing_ms":value.get("bridge_timing",{}).get("a_processing_ms")}
                          command_timings.append(timing)
                          value["_bridge_timing"]=timing
                          return value
                  time.sleep(1.0)
              raise TimeoutError(f"Timed out waiting for browser command {action}")

          nonlocal_seq=[last_seq]
          initial=send("status")
          startup_status_checks=0
          if operation in {"semantic-inspect","semantic-edit","semantic-build","preview-smoke","latency-benchmark"}:
              scene_deadline=time.monotonic()+900
              while ".tscn" not in str(initial.get("title","")):
                  if time.monotonic()>=scene_deadline:
                      raise TimeoutError("The editor surface is open but the project scene did not finish loading")
                  time.sleep(2.0)
                  initial=send("status")
                  startup_status_checks+=1
          latency_benchmark=None
          if operation=="latency-benchmark":
              # Two warm-ups, then twelve measured semantic round trips on the same live A session.
              for index in range(2):
                  send("semantic_command",editor_action="editor.get_state",args={})
              samples=[]
              for index in range(12):
                  response=send("semantic_command",editor_action="editor.get_state",args={})
                  samples.append(response["_bridge_timing"])
              after=send("status")
              latency_benchmark={"warmup_commands":2,"measured_commands":len(samples),"samples":samples}
              extra={"latency_benchmark":latency_benchmark}
              commands_sent=16
          elif operation=="inspect":
              screenshot=send("screenshot",include_image=True,scope="page")
              after=send("status")
              extra={"screenshot":screenshot}
              commands_sent=3
          elif operation in {"semantic-inspect","semantic-edit"}:
              semantic=send("semantic_command",editor_action=semantic_action,args=semantic_args)
              if operation=="semantic-inspect" and semantic_action=="scene.inspect_node":
                  inspected=semantic.get("result",{})
                  if not inspected.get("name") or not isinstance(inspected.get("properties"),list) or not inspected.get("properties"):
                      raise RuntimeError("The Inspector query returned no node identity or visible properties")
              verification=None
              if operation=="semantic-edit" and semantic_action=="scene.add_node":
                  verification=send("semantic_command",editor_action="scene.get_tree",args={})
                  created=semantic.get("result",{}).get("created",{})
                  created_name=created.get("name")
                  def tree_contains(node,name):
                      return isinstance(node,dict) and (node.get("name")==name or any(tree_contains(child,name) for child in node.get("children",[])))
                  if not created_name or not tree_contains(verification.get("result",{}),created_name):
                      raise RuntimeError("The editor acknowledged creation but the follow-up scene tree did not contain the new node")
              elif operation=="semantic-edit" and semantic_action=="scene.set_property":
                  verification=send("semantic_command",editor_action="scene.inspect_node",args={"path":semantic_args["path"]})
                  expected=semantic.get("result",{}).get("value")
                  actual=[item.get("value") for item in verification.get("result",{}).get("properties",[]) if item.get("name")==semantic_args["property"]]
                  if not actual or actual[0]!=expected:
                      raise RuntimeError("The Inspector read-back did not match the value applied by the semantic edit")
              screenshot=send("screenshot",include_image=True,scope="canvas")
              after=send("status")
              extra={"semantic":semantic,"verification":verification,"screenshot":screenshot}
              commands_sent=5 if operation=="semantic-edit" else 4
          elif operation=="ui-action":
              ui_action=request.get("ui_action")
              ui_args=request.get("ui_args",{})
              if ui_action not in {"click_text","press_key","canvas_click","assert_text"} or not isinstance(ui_args,dict):
                  raise SystemExit("ui-action must use a bounded browser UI action and an object of arguments")
              ui_result=send(ui_action,**ui_args)
              screenshot=send("screenshot",include_image=True,scope="page")
              after=send("status")
              extra={"ui_action":ui_result,"screenshot":screenshot}
              commands_sent=4
          elif operation=="stop":
              stopped=send("stop")
              after=initial
              extra={"stop":stopped}
              commands_sent=2
          elif operation=="semantic-build":
              nodes=request.get("nodes")
              if not isinstance(nodes,list) or not nodes or len(nodes)>12:
                  raise SystemExit("semantic-build requires 1-12 node specifications")
              names=[node.get("node_name") for node in nodes if isinstance(node,dict)]
              if len(names)!=len(nodes) or len(set(names))!=len(names):
                  raise SystemExit("semantic-build node specifications must be objects with unique node_name values")
              allowed_node_types={"Node","Node2D","Sprite2D","AnimatedSprite2D","Polygon2D","Line2D","CharacterBody2D","RigidBody2D","StaticBody2D","Area2D","CollisionShape2D","CollisionPolygon2D","RayCast2D","VisibleOnScreenNotifier2D","Camera2D","Marker2D","Path2D","PathFollow2D","TileMapLayer","Parallax2D","RemoteTransform2D","CanvasLayer","Control","Label","RichTextLabel","TextureRect","ColorRect","Panel","Button","TextureButton","ProgressBar","VBoxContainer","HBoxContainer","GridContainer","MarginContainer","CenterContainer","SubViewport","SubViewportContainer","AnimationPlayer","AnimationTree","Timer","AudioStreamPlayer","AudioStreamPlayer2D"}
              property_count=0
              for node in nodes:
                  if set(node)-{"node_type","node_name","parent_path","properties"} or not {"node_type","node_name"}.issubset(node):
                      raise SystemExit("Each node needs allowlisted type/name, optional parent_path, and optional properties")
                  if node["node_type"] not in allowed_node_types or not isinstance(node["node_name"],str) or not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]{0,47}",node["node_name"]):
                      raise SystemExit("Node type or name is not allowlisted")
                  if "parent_path" in node and (not isinstance(node["parent_path"],str) or not node["parent_path"] or len(node["parent_path"])>200 or node["parent_path"].startswith("/") or ".." in node["parent_path"].split("/") or "//" in node["parent_path"]):
                      raise SystemExit("Node parent path must stay inside the edited scene root")
                  properties=node.get("properties",{})
                  if not isinstance(properties,dict) or len(properties)>12:
                      raise SystemExit("Each node may set at most 12 Inspector properties")
                  for prop,value in properties.items():
                      validate_property_args({"path":node["node_name"],"property":prop,"value":value})
                      property_count+=1
              created=[]
              property_edits=[]
              for node_spec in nodes:
                  node_args={key:value for key,value in node_spec.items() if key!="properties"}
                  result=send("semantic_command",editor_action="scene.add_node",args=node_args)
                  created_info=result.get("result",{}).get("created",{})
                  if not created_info.get("path"):
                      raise RuntimeError("Node creation returned no verified scene path")
                  created.append(created_info)
                  for prop,value in node_spec.get("properties",{}).items():
                      edit=send("semantic_command",editor_action="scene.set_property",args={"path":created_info["path"],"property":prop,"value":value})
                      property_edits.append({"path":created_info["path"],"property":prop,"result":edit})
              verification=send("semantic_command",editor_action="scene.get_tree",args={})
              def tree_contains(node,name):
                  return isinstance(node,dict) and (node.get("name")==name or any(tree_contains(child,name) for child in node.get("children",[])))
              missing=[item.get("name") for item in created if not tree_contains(verification.get("result",{}),item.get("name"))]
              if missing:
                  raise RuntimeError("Scene tree verification did not find created nodes: "+", ".join(str(name) for name in missing))
              property_verifications=[]
              for node_spec,created_info in zip(nodes,created):
                  if not node_spec.get("properties"):
                      continue
                  inspected=send("semantic_command",editor_action="scene.inspect_node",args={"path":created_info["path"]})
                  actual={item.get("name"):item.get("value") for item in inspected.get("result",{}).get("properties",[])}
                  for prop in node_spec["properties"]:
                      expected=next((entry["result"].get("result",{}).get("value") for entry in property_edits if entry["path"]==created_info["path"] and entry["property"]==prop),None)
                      if prop not in actual or actual[prop]!=expected:
                          raise RuntimeError("Inspector read-back failed for "+created_info["path"]+"."+prop)
                  property_verifications.append({"path":created_info["path"],"inspection":inspected})
              screenshot=send("screenshot",include_image=True,scope="page")
              after=send("status")
              extra={"created":created,"property_edits":property_edits,"property_verifications":property_verifications,"verification":verification,"screenshot":screenshot}
              commands_sent=len(nodes)+property_count+len(property_verifications)+4
          elif operation=="preview-smoke":
              launched={"already_running":True,"title":initial.get("title")} if "(DEBUG)" in str(initial.get("title","")) else send("run_game")
              game_view=send("game_view")
              if not game_view.get("preview_detected"):
                  raise RuntimeError("F6 was sent but no visible game-preview canvas was detected")
              before=send("screenshot",include_image=True,scope="canvas")
              pointer=send("game_click",x=0.5,y=0.5)
              movement=send("game_input",key="d",duration_ms=650)
              jump=send("game_input",key="Space",duration_ms=180)
              screenshot=send("screenshot",include_image=True,scope="canvas")
              after=send("status")
              extra={"run_game":launched,"game_view":game_view,"before_screenshot":before,"pointer_input":pointer,"movement_input":movement,"jump_input":jump,"after_screenshot":screenshot,"input_note":"Before/after game-canvas images bracket a mouse click, right-movement key and jump key delivered to the running preview."}
              commands_sent=9
          else:
              canvas_click=send("canvas_click",x=0.02,y=0.02)
              escaped=send("press_key",key="Escape")
              screenshot=send("screenshot")
              after=send("status")
              extra={"canvas_click":canvas_click,"escape_key":escaped,"screenshot":screenshot}
              commands_sent=5
          commands_sent+=startup_status_checks
          def stable_title(value):
              return re.sub(r"^\(\*\)\s*","",str(value or ""))
          if initial.get("url")!=after.get("url"):
              raise RuntimeError("The local editor URL changed while Workflow B was operating it")
          if operation not in {"preview-smoke","stop"} and stable_title(initial.get("title"))!=stable_title(after.get("title")):
              raise RuntimeError("The editor title changed unexpectedly while Workflow B was operating it")
          if operation=="preview-smoke" and "(DEBUG)" not in str(after.get("title","")):
              raise RuntimeError("F6 did not leave the running game in its expected debug preview state")
          if not after.get("visible_canvases"):
              raise RuntimeError("The same browser session no longer exposes a visible canvas")
          latency_values=sorted(item["round_trip_ms"] for item in command_timings)
          def percentile(values, fraction):
              if not values: return None
              if fraction == 0.5 and len(values) % 2 == 0:
                  middle=len(values)//2
                  return round((values[middle-1]+values[middle])/2,2)
              return values[min(len(values)-1, max(0, int((len(values)-1)*fraction + 0.999999)))]
          bridge_timing={"commands":command_timings,"count":len(latency_values),"min_ms":min(latency_values) if latency_values else None,"median_ms":percentile(latency_values,0.5),"p95_ms":percentile(latency_values,0.95),"max_ms":max(latency_values) if latency_values else None}
          if latency_benchmark is not None:
              measured=sorted(item["round_trip_ms"] for item in latency_benchmark["samples"])
              latency_benchmark.update({"min_ms":min(measured),"median_ms":percentile(measured,0.5),"p95_ms":percentile(measured,0.95),"max_ms":max(measured)})
          result={"workflow":"B-operator-ephemeral","operation":operation,"session_id":session_id,
                  "connection_timing":{"ready_marker_wait_ms":ready_marker_wait_ms,"neon_join_ms":neon_join_ms,
                                       "first_command_round_trip_ms":initial.get("_bridge_timing",{}).get("round_trip_ms")},
                  "operator_runtime_ms":round((time.monotonic()-operator_started)*1000,2),"bridge_timing":bridge_timing,
                  "issue_number":issue_number,"commands_sent":commands_sent,**extra,
                  "initial_status":initial,"final_status":after,"session_kept_open":operation!="stop"}
          Path("operator-result.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
