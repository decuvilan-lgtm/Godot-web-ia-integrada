name: Persistent Godot Session Bridge (Workflow B)
run-name: Godot transport bridge — ${{ github.run_id }}

on:
  push:
    branches:
      - test/verdant-valley-development-benchmark
    paths:
      - ".session-operator-request.json"

permissions:
  contents: read
  id-token: write

concurrency:
  group: godot-session-bridge-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the explicit bridge request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Validate bridge code and request-envelope tests
        run: |
          python3 -m py_compile scripts/bridge/bridge_request.py
          python3 -m unittest discover -s tests -p 'test_bridge_request.py' -v

      - name: Forward exactly one operator-supplied command to A
        env:
          AB_API_URL: https://br-falling-waterfall-b5x4fu2i-abbridge.compute.c-7.us-east-2.aws.neon.tech
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python3 scripts/bridge/bridge_request.py

      - name: Upload the unmodified A response and transport metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-bridge-response-${{ github.run_id }}
          path: operator-result.json
          if-no-files-found: warn
          retention-days: 14
