name: A/B artifact transport validation

on:
  push:
    branches:
      - test/verdant-valley-development-benchmark
    paths:
      - "scripts/bridge/artifacts.py"
      - "tests/test_ab_artifacts.py"
      - "neon/functions/abbridge/**"
      - ".github/workflows/ab-artifact-validation.yml"
  pull_request:
    paths:
      - "scripts/bridge/artifacts.py"
      - "tests/test_ab_artifacts.py"
      - ".github/workflows/ab-artifact-validation.yml"
  workflow_dispatch:

# Fast feedback for the artifact protocol and its client orchestration; no live storage writes.

permissions:
  contents: read

jobs:
  artifact-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check Neon artifact Function syntax
        run: node --check neon/functions/abbridge/index.mjs
      - name: Compile artifact transport module
        run: python -m py_compile scripts/bridge/artifacts.py
      - name: Run artifact transfer contract tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_ab_artifacts.py' -v
