name: Verify Godot Web Editor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-web-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build and verify official web editor
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends curl unzip

      - name: Verify pinned Godot source submodule
        run: bash scripts/verify-engine-pin.sh

      - name: Validate GitHub importer patch against pinned Godot source
        run: bash scripts/prepare-engine-source.sh

      - name: Validate bridge sandbox in native Godot headless editor
        run: bash scripts/test-bridge-sandbox.sh

      - name: Build pinned Godot Web Editor
        run: bash scripts/build-web.sh

      - name: Verify published bundle
        run: python3 scripts/verify-web-build.py

      - name: Run three-minute HTTP stability test
        run: bash scripts/soak-test-web.sh

      - name: Report bundle size
        run: du -sh public
