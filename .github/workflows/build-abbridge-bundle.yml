name: Build Neon A/B bridge deployment bundle

on:
  workflow_dispatch:
  push:
    branches:
      - test/verdant-valley-development-benchmark
    paths:
      - "neon/functions/abbridge/**"
      - ".github/workflows/build-abbridge-bundle.yml"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/verdant-valley-development-benchmark
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: neon/functions/abbridge/package.json
      - name: Install production dependencies
        working-directory: neon/functions/abbridge
        run: npm install --omit=dev --no-audit --no-fund
      - name: Validate and package deployable Function
        working-directory: neon/functions/abbridge
        run: |
          node --check index.mjs
          node --input-type=module -e "import('./index.mjs').then(() => console.log('Function module loaded'))"
          zip -qr "$GITHUB_WORKSPACE/abbridge-deployment.zip" index.mjs package.json node_modules
          unzip -t "$GITHUB_WORKSPACE/abbridge-deployment.zip"
          ls -lh "$GITHUB_WORKSPACE/abbridge-deployment.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: abbridge-deployment-bundle
          path: abbridge-deployment.zip
          retention-days: 3
      - name: Publish base64 archive chunks for the Neon deployment API
        run: |
          mkdir -p .github/abbridge-bundle
          base64 -w0 abbridge-deployment.zip > /tmp/abbridge-deployment.b64
          rm -f .github/abbridge-bundle/part-*.b64
          split -b 400000 -d --additional-suffix=.b64 /tmp/abbridge-deployment.b64 .github/abbridge-bundle/part-
          printf '%s\n' "$GITHUB_SHA" > .github/abbridge-bundle/source-commit.txt
          printf '%s\n' "$(find .github/abbridge-bundle -maxdepth 1 -name 'part-*.b64' | wc -l)" > .github/abbridge-bundle/part-count.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/abbridge-bundle
          git commit -m "Publish staging A/B bridge deployment bundle"
          git push origin HEAD:test/verdant-valley-development-benchmark
