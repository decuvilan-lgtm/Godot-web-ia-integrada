name: Browser smoke test using a selected Godot Web Editor artifact

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful Build Godot Web Editor with Built-in Agent run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: godot-web-agent-browser-smoke-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out controller repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download the selected custom Web Editor artifact
        uses: actions/download-artifact@v8
        with:
          name: godot-web-editor-agent-\${{ inputs.artifact_run_id }}
          run-id: \${{ inputs.artifact_run_id }}
          github-token: \${{ secrets.GITHUB_TOKEN }}
          path: downloaded-artifact

      - name: Verify and extract the custom Web Editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/editor
          ZIP_FILE="$(find downloaded-artifact -maxdepth 1 -type f -name '*editor*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          EXPECTED_SHA="$(awk -v f="artifacts/$(basename "$ZIP_FILE")" '$2 == f { print $1 }' downloaded-artifact/SHA256SUMS)"
          ACTUAL_SHA="$(sha256sum "$ZIP_FILE" | awk '{print $1}')"
          test -n "$EXPECTED_SHA"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          unzip -q "$ZIP_FILE" -d artifacts/editor
          test -s artifacts/editor/godot.editor.wasm
          cp downloaded-artifact/BUILD-METADATA.txt artifacts/

      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.52.0
          python -m playwright install --with-deps chromium

      - name: Test the read-only native agent against the versioned diagnostics fixture
        run: |
          python scripts/build/smoke_test_godot_web_agent.py \
            --editor-dir artifacts/editor \
            --project-dir tests/fixtures/diagnostics-godot-project \
            --timeout-seconds 600 \
            --screenshot artifacts/browser-smoke.png \
            --diagnostics artifacts/browser-smoke-diagnostics.json
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: godot-web-agent-browser-smoke-\${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
