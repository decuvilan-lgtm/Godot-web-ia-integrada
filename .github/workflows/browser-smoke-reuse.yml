name: Browser smoke test using cached Godot Web Editor artifact

on:
  push:
    branches:
      - feature/builtin-web-editor-agent
    paths:
      - 'scripts/build/smoke_test_godot_web_agent.py'
      - '.github/workflows/browser-smoke-reuse.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: godot-web-agent-browser-smoke
  cancel-in-progress: false

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out controller repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download previously compiled editor artifact
        uses: actions/download-artifact@v4
        with:
          name: godot-web-editor-agent-43546004745
          run-id: 43546004745
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded-artifact

      - name: Verify and extract the cached editor
        run: |
          set -euo pipefail
          mkdir -p artifacts/outer artifacts/editor
          cp -a downloaded-artifact/. artifacts/outer/
          INNER_ZIP="$(find artifacts/outer -maxdepth 1 -type f -name '*editor*.zip' -print -quit)"
          test -n "$INNER_ZIP"
          EXPECTED_SHA="$(awk '{print $1}' artifacts/outer/SHA256SUMS)"
          ACTUAL_SHA="$(sha256sum "$INNER_ZIP" | awk '{print $1}')"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA" || {
            echo "Cached editor archive checksum mismatch."
            exit 1
          }
          unzip -q "$INNER_ZIP" -d artifacts/editor
          test -s artifacts/editor/godot.editor.wasm
          cp artifacts/outer/BUILD-METADATA.txt artifacts/

      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.52.0
          python -m playwright install --with-deps chromium

      - name: Launch cached editor in Chromium and probe the native agent
        run: |
          python scripts/build/smoke_test_godot_web_agent.py \
            --editor-zip "$(find artifacts/outer -maxdepth 1 -type f -name '*.zip' -print -quit || true)" \
            --timeout-seconds 600 \
            --screenshot artifacts/browser-smoke.png \
            --diagnostics artifacts/browser-smoke-diagnostics.json
        env:
          PYTHONUNBUFFERED: '1'

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-browser-diagnostics-${{ github.run_id }}
          path: |
            artifacts/browser-smoke.png
            artifacts/browser-smoke-diagnostics.json
            artifacts/BUILD-METADATA.txt
          if-no-files-found: warn
          retention-days: 14
