name: Persistent Godot Session Keeper

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: godot-persistent-session-keeper
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Keep active Relay sessions warm and refresh their idle leases
        env:
          RELAY_URL: https://godot-web-ia-relay.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          relay=os.environ["RELAY_URL"].rstrip("/")
          token_url=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]+"&audience=godot-web-ia-relay"
          token_req=urllib.request.Request(token_url,headers={"Authorization":"Bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(token_req,timeout=20) as r: token=json.load(r)["value"]
          headers={"Authorization":"Bearer "+token,"Accept":"application/json"}
          def request(path,method="GET"):
              req=urllib.request.Request(relay+path,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          sessions=request("/v1/persistent-sessions").get("sessions",[])
          refreshed=[]
          for session in sessions:
              sid=session["session_id"]
              state=request(f"/v1/persistent-sessions/{sid}/heartbeat","POST")
              refreshed.append({"session_id":sid,"state":session["state"],"idle_ttl_seconds":state["idle_ttl_seconds"]})
          print(json.dumps({"active_sessions":len(refreshed),"heartbeats":refreshed},indent=2))
          PY
