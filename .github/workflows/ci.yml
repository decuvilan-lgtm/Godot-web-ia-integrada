name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate shell and Python scripts
        run: |
          bash -n scripts/build-web.sh
          bash -n scripts/ci/run-godot-task.sh
          ruby -e 'require "yaml"; c = YAML.load_file(".circleci/config.yml"); abort "CircleCI job missing" unless c.dig("jobs", "godot-task")'
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/persistent-session-smoke.yml"); YAML.load_file(".github/workflows/remote-godot-task.yml")'
          python -m py_compile scripts/bridge/prepare_issue.py scripts/bridge/test_prepare_issue.py scripts/patch-web-shell.py scripts/package-bridge-sandbox.py relay/app.py relay/github_archives.py relay/test_github_archives.py relay/command_center.py relay/admin.py relay/visual_storage.py relay/visual_proxy.py relay/project_sync.py relay/test_app.py relay/storage_cors.py relay/persistent_sessions.py relay/test_persistent_sessions.py tests/live_link/test_storage_cors.py
      - name: Test ChatGPT GitHub Bridge task validation
        run: python -m unittest discover -s scripts/bridge -p 'test_*.py' -v
      - name: Test mobile shell patcher
        run: python -m unittest scripts/test_patch_web_shell.py -v
      - name: Test interactive gameplay controller
        run: |
          node --check scripts/gameplay-test-controller.cjs
          node scripts/test-gameplay-test-controller.cjs
          node --check scripts/godot-input-map.cjs
          node scripts/test-godot-input-map.cjs
      - name: Install screenshot analysis dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Test gameplay screenshot difference analysis
        run: python -m unittest scripts/test_analyze_gameplay_captures.py -v
      - name: Package and validate bridge sandbox
        run: |
          python scripts/package-bridge-sandbox.py
          unzip -t public/bridge-sandbox.zip

      - name: Validate required deployment configuration
        run: |
          grep -q 'runtime: static' render.yaml
          grep -q 'staticPublishPath: ./public' render.yaml
          grep -q 'Godot_v4.7.2-stable_web_editor.zip' scripts/build-web.sh
          grep -q 'plan: free' render-relay.yaml

  relay-api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install relay test dependencies
        run: pip install -r requirements.txt
      - name: Run relay API tests
        run: |
          python -m unittest -v test_app.py
          python -m unittest -v test_github_archives.py
          python -m unittest -v test_persistent_sessions.py
          PYTHONPATH=.. python -m unittest discover -s ../tests/live_link -p 'test_storage_cors.py' -v


  godot-scene-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Run structured 3D scene audit
        env:
          GODOT_TASK_PROFILE: scene_audit_3d
          GODOT_TASK_REQUEST_ID: ci-scene-audit-12345678
        run: bash scripts/ci/run-godot-task.sh
      - name: Upload scene audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-scene-audit
          path: /tmp/godot-task-results/
          if-no-files-found: warn
          retention-days: 7

  godot-plugin-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Download and verify official Godot 4.7.2 editor
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/godot-linux.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl --fail --location --retry 3 \
            --output /tmp/SHA512-SUMS.txt \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt
          expected="$(awk '$2 == "Godot_v4.7.2-stable_linux.x86_64.zip" { print $1 }' /tmp/SHA512-SUMS.txt)"
          test -n "$expected"
          printf '%s  /tmp/godot-linux.zip\n' "$expected" | sha512sum --check -
          mkdir -p /tmp/godot
          unzip -q /tmp/godot-linux.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import sandbox and load editor plugin
        shell: bash
        run: |
          set -o pipefail
          timeout 90 /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --editor --path examples/bridge-sandbox --quit \
            2>&1 | tee /tmp/godot-plugin-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-plugin-smoke.log; then
            echo "Godot reported a plugin or script error."
            exit 1
          fi
