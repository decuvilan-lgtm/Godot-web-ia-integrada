name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate shell scripts
        run: bash -n scripts/build-web.sh
      - name: Validate Python scripts
        run: python -m py_compile scripts/patch-web-shell.py scripts/package-bridge-sandbox.py
      - name: Validate required deployment configuration
        run: |
          grep -q 'runtime: static' render.yaml
          grep -q 'staticPublishPath: ./public' render.yaml
          grep -q 'Godot_v4.7.2-stable_web_editor.zip' scripts/build-web.sh

  godot-plugin-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Download official Godot 4.7.2 editor
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/godot-linux.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot-linux.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import sandbox and load editor plugin
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --editor --path examples/bridge-sandbox --quit \
            2>&1 | tee /tmp/godot-plugin-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-plugin-smoke.log; then
            echo "Godot reported a plugin or script error."
            exit 1
          fi
