name: Publish versioned Godot Web agent editor

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful build-godot-web-agent-editor workflow run ID
        required: true
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: godot-web-agent-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download custom editor build artifact
        uses: actions/download-artifact@v4
        with:
          name: godot-web-editor-agent-${{ inputs.build_run_id }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded

      - name: Verify provenance, checksum, and prepare release assets
        id: prepare
        shell: bash
        run: |
          set -Eeuo pipefail
          ZIP="downloaded/artifacts/godot.web.editor.wasm32.zip"
          SUMS="downloaded/SHA256SUMS"
          META="downloaded/BUILD-METADATA.txt"
          test -s "$ZIP"
          test -s "$SUMS"
          test -s "$META"
          grep -qx 'godot_ref=4.7.2-stable' "$META"
          grep -qx 'project_overlay=false' "$META"
          grep -qx 'deployment=not_performed' "$META"
          EXPECTED="$(awk 'NR == 1 {print $1}' "$SUMS")"
          ACTUAL="$(sha256sum "$ZIP" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          GODOT_COMMIT="$(sed -n 's/^godot_commit=//p' "$META")"
          [[ "$GODOT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          SHORT="${GODOT_COMMIT:0:12}"
          TAG="godot-web-agent-4.7.2-$SHORT"
          mkdir -p release-assets
          cp "$ZIP" release-assets/godot.web.editor.wasm32.zip
          cp "$META" release-assets/BUILD-METADATA.txt
          printf '%s  %s\n' "$ACTUAL" "godot.web.editor.wasm32.zip" > release-assets/SHA256SUMS
          {
            echo "tag=$TAG"
            echo "godot_commit=$GODOT_COMMIT"
            echo "sha256=$ACTUAL"
          } >> "$GITHUB_OUTPUT"
          echo "Verified custom editor: $TAG ($ACTUAL)"

      - name: Publish immutable versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          name: Godot Web Agent Editor 4.7.2 (${{ steps.prepare.outputs.godot_commit }})
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release-assets/godot.web.editor.wasm32.zip
            release-assets/SHA256SUMS
            release-assets/BUILD-METADATA.txt
          body: |
            Custom Godot 4.7.2 Web Editor with the built-in read-only semantic agent.
            Built from upstream Godot commit ${{ steps.prepare.outputs.godot_commit }}.
            No game project overlay is included.
            Verify the downloaded editor archive with SHA256SUMS before use.
