name: Persistent Godot Session Host (Workflow A)
run-name: Godot Web host — ${{ inputs.duration_minutes || 10 }} min

on:
  push:
    branches:
      - test/verdant-valley-development-benchmark
    paths:
      - ".github/workflows/persistent-session-host.yml"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: How long Workflow A keeps the same Godot Web session open (default 10; allowed 1-340)
        required: true
        default: 10
        type: number
      repository:
        description: Project repository (owner/name)
        required: true
        default: decuvilan-lgtm/Godot-web-ia-integrada
        type: string
      branch:
        description: Project branch
        required: true
        default: test/verdant-valley-development-benchmark
        type: string
      project_path:
        description: Folder containing project.godot
        required: false
        default: examples/verdant-valley
        type: string

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: godot-session-host-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Open and hold the shared Godot Web editor session
        env:
          RELAY_URL: https://godot-web-ia-relay-test.onrender.com
          DURATION_MINUTES: ${{ inputs.duration_minutes || '10' }}
          REPOSITORY: ${{ inputs.repository || 'decuvilan-lgtm/Godot-web-ia-integrada' }}
          BRANCH: ${{ inputs.branch || 'test/verdant-valley-development-benchmark' }}
          PROJECT_PATH: ${{ inputs.project_path || 'examples/verdant-valley' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, time, urllib.error, urllib.parse, urllib.request

          relay=os.environ["RELAY_URL"].rstrip("/")
          raw_duration=os.environ.get("DURATION_MINUTES","10").strip()
          numeric_duration=float(raw_duration)
          if not numeric_duration.is_integer():
              raise RuntimeError("duration_minutes must be a whole number")
          duration=int(numeric_duration)
          if not 1 <= duration <= 340:
              raise RuntimeError("duration_minutes must be between 1 and 340")

          def get_oidc_token():
              token_url=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]+"&audience=godot-web-ia-relay"
              token_req=urllib.request.Request(token_url,headers={"Authorization":"Bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
              with urllib.request.urlopen(token_req,timeout=20) as response:
                  return json.load(response)["value"]

          auth={"token":get_oidc_token()}
          def call(path,method="GET",payload=None,timeout=120):
              data=None if payload is None else json.dumps(payload).encode()
              for attempt in range(2):
                  headers={"Authorization":"Bearer "+auth["token"],"Accept":"application/json","Content-Type":"application/json"}
                  req=urllib.request.Request(relay+path,data=data,headers=headers,method=method)
                  try:
                      with urllib.request.urlopen(req,timeout=timeout) as response:
                          raw=response.read()
                          return json.loads(raw) if raw else {}
                  except urllib.error.HTTPError as exc:
                      if exc.code==401 and attempt==0:
                          auth["token"]=get_oidc_token()
                          continue
                      detail=exc.read().decode("utf-8","replace")[:1200]
                      if exc.code in (404,410) and method=="DELETE":
                          return {"closed":True,"already_expired":True,"http_status":exc.code}
                      raise RuntimeError(f"Relay HTTP {exc.code}: {detail}") from exc

          # Resolve the branch to an immutable SHA on the GitHub runner.
          # Render's free runtime may be rate-limited on unauthenticated GitHub API calls.
          api="https://api.github.com/repos/"+os.environ["REPOSITORY"]
          github_headers={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],
                          "Accept":"application/vnd.github+json",
                          "X-GitHub-Api-Version":"2022-11-28"}
          branch_url=api+"/branches/"+urllib.parse.quote(os.environ["BRANCH"],safe="")
          branch_req=urllib.request.Request(branch_url,headers=github_headers)
          with urllib.request.urlopen(branch_req,timeout=30) as response:
              effective_sha=str(json.load(response).get("commit",{}).get("sha","")).lower()
          if not re.fullmatch(r"(?:[0-9a-f]{40}|[0-9a-f]{64})",effective_sha):
              raise RuntimeError("GitHub did not return a full commit SHA for the selected branch")

          opened=call("/v1/persistent-sessions","POST",{
              "repository":os.environ["REPOSITORY"],
              "branch":os.environ["BRANCH"],
              "project_path":os.environ.get("PROJECT_PATH",""),
              "commit_sha":effective_sha,
              "reuse_existing":True,
              "reimport_existing":False,
              "duration_seconds":duration*60,
          },timeout=180)
          sid=opened["session_id"]
          status=opened
          while status.get("state") == "loading":
              print(json.dumps({"session_id":sid,"editor_state":"loading","message":"Waiting for exact project SHA and editor canvas"}))
              time.sleep(5)
              try:
                  status=call(f"/v1/persistent-sessions/{urllib.parse.quote(sid,safe='')}")
              except RuntimeError as exc:
                  if "HTTP 404" in str(exc) or "HTTP 410" in str(exc):
                      raise RuntimeError("Relay closed the session because the Godot project did not become ready or the host was lost") from exc
                  raise
          if status.get("state") != "open" or not status.get("ready"):
              raise RuntimeError(f"Godot editor did not become ready: {status}")
          expires_at=float(status["expires_at"])
          print(json.dumps({
              "workflow":"A-host",
              "session_id":sid,
              "reused":opened.get("reused",False),
              "configured_duration_seconds":status.get("max_duration_seconds"),
              "remaining_seconds":status.get("remaining_seconds"),
              "expires_at":expires_at,
              "editor_state":"ready",
              "commit_sha":effective_sha,
          },indent=2))

          # End-to-end verification: dispatch Workflow B as a separate run
          # against this exact session, then wait for its inspect operation.
          api="https://api.github.com/repos/"+os.environ["REPOSITORY"]
          api_headers={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],
                       "Accept":"application/vnd.github+json",
                       "X-GitHub-Api-Version":"2022-11-28",
                       "Content-Type":"application/json"}
          dispatch_payload={"ref":os.environ["GITHUB_REF_NAME"],"inputs":{
              "operation":"inspect","session_id":sid,
              "repository":os.environ["REPOSITORY"],
              "branch":os.environ["BRANCH"],
              "project_path":os.environ["PROJECT_PATH"]}}
          dispatch_req=urllib.request.Request(
              api+"/actions/workflows/persistent-session-operator.yml/dispatches",
              data=json.dumps(dispatch_payload).encode(),headers=api_headers,method="POST")
          with urllib.request.urlopen(dispatch_req,timeout=30) as response:
              if response.status not in (200,204):
                  raise RuntimeError("Workflow B dispatch returned HTTP "+str(response.status))
          print(json.dumps({"workflow":"A-host","workflow_b":"dispatched","operation":"inspect","session_id":sid}))

          b_run_id=None
          deadline=time.time()+240
          while time.time()<deadline:
              runs_req=urllib.request.Request(api+"/actions/runs?event=workflow_dispatch&branch="+
                  urllib.parse.quote(os.environ["BRANCH"],safe="")+"&per_page=30",headers=api_headers)
              with urllib.request.urlopen(runs_req,timeout=30) as response:
                  runs=json.load(response).get("workflow_runs",[])
              candidates=[run for run in runs if run.get("path")==".github/workflows/persistent-session-operator.yml"
                          and run.get("head_sha")==os.environ["GITHUB_SHA"]]
              if candidates:
                  b_run_id=max(candidates,key=lambda run:run.get("created_at",""))["id"]
                  run_req=urllib.request.Request(api+"/actions/runs/"+str(b_run_id),headers=api_headers)
                  with urllib.request.urlopen(run_req,timeout=30) as response:
                      b_run=json.load(response)
                  if b_run.get("status")=="completed":
                      if b_run.get("conclusion")!="success":
                          raise RuntimeError("Workflow B failed: "+str(b_run.get("html_url"))+
                                             " conclusion="+str(b_run.get("conclusion")))
                      print(json.dumps({"workflow":"B-operator","run_id":b_run_id,"conclusion":"success",
                                        "session_id":sid,"session_kept_open":True}))
                      break
              time.sleep(10)
          else:
              raise RuntimeError("Timed out waiting for Workflow B to inspect the existing session")

          # Keep this workflow alive and ping the same Relay-owned page.
          # Heartbeats keep the hosting service warm; they never extend session expiry.
          while True:
              remaining=expires_at-time.time()
              if remaining <= 0:
                  break
              time.sleep(min(30,max(1,remaining)))
              remaining=expires_at-time.time()
              if remaining > 0:
                  try:
                      heartbeat=call(f"/v1/persistent-sessions/{urllib.parse.quote(sid,safe='')}/heartbeat","POST",timeout=25)
                      print(json.dumps({"session_id":sid,"heartbeat":"ok","remaining_seconds":int(remaining)}))
                  except RuntimeError as exc:
                      if "HTTP 404" in str(exc) or "HTTP 410" in str(exc):
                          print(f"Session ended before its scheduled expiry: {exc}")
                          break
                      raise

          # The Relay's own reaper is the fallback if this workflow is cancelled.
          # At the deadline the server may already have closed the page.
          closed=call(f"/v1/persistent-sessions/{urllib.parse.quote(sid,safe='')}","DELETE",timeout=25)
          print(json.dumps({"workflow":"A-host","session_id":sid,"host_finished":True,"close_result":closed},indent=2))
          PY
